<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Save Layout As file browser</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="fm-ui.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&amp;family=Noto+Sans+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1080px; height: 720px; overflow: hidden">
<dc-import name="FileBrowser" mode="Save" save-name="dusk_valley_night" theme="{{theme}}" material="{{material}}" hint-size="1080px,720px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Dark&quot;,&quot;Light&quot;],&quot;default&quot;:&quot;Light&quot;},&quot;material&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Solid&quot;,&quot;Blur&quot;],&quot;default&quot;:&quot;Blur&quot;},&quot;$preview&quot;:{&quot;width&quot;:1080,&quot;height&quot;:720}}">
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'Dark', material: this.props.material ?? 'Blur', yes: true };
  }
}
</script>
</body>
</html>
