","flag: Svalbard & Jan Mayen"],["🇸🇰","flag: Slovakia"],["🇸🇱","flag: Sierra Leone"],["🇸🇲","flag: San Marino"],["🇸🇳","flag: Senegal"],["🇸🇴","flag: Somalia"],["🇸🇷","flag: Suriname"],["🇸🇸","flag: South Sudan"],["🇸🇹","flag: São Tomé & Príncipe"],["🇸🇻","flag: El Salvador"],["🇸🇽","flag: Sint Maarten"],["🇸🇾","flag: Syria"],["🇸🇿","flag: Eswatini"],["🇹🇦","flag: Tristan da Cunha"],["🇹🇨","flag: Turks & Caicos Islands"],["🇹🇩","flag: Chad"],["🇹🇫","flag: French Southern Territories"],["🇹🇬","flag: Togo"],["🇹🇭","flag: Thailand"],["🇹🇯","flag: Tajikistan"],["🇹🇰","flag: Tokelau"],["🇹🇱","flag: Timor-Leste"],["🇹🇲","flag: Turkmenistan"],["🇹🇳","flag: Tunisia"],["🇹🇴","flag: Tonga"],["🇹🇷","flag: Türkiye"],["🇹🇹","flag: Trinidad & Tobago"],["🇹🇻","flag: Tuvalu"],["🇹🇼","flag: Taiwan"],["🇹🇿","flag: Tanzania"],["🇺🇦","flag: Ukraine"],["🇺🇬","flag: Uganda"],["🇺🇲","flag: U.S. Outlying Islands"],["🇺🇳","flag: United Nations"],["🇺🇸","flag: United States"],["🇺🇾","flag: Uruguay"],["🇺🇿","flag: Uzbekistan"],["🇻🇦","flag: Vatican City"],["🇻🇨","flag: St. Vincent & Grenadines"],["🇻🇪","flag: Venezuela"],["🇻🇬","flag: British Virgin Islands"],["🇻🇮","flag: U.S. Virgin Islands"],["🇻🇳","flag: Vietnam"],["🇻🇺","flag: Vanuatu"],["🇼🇫","flag: Wallis & Futuna"],["🇼🇸","flag: Samoa"],["🇽🇰","flag: Kosovo"],["🇾🇪","flag: Yemen"],["🇾🇹","flag: Mayotte"],["🇿🇦","flag: South Africa"],["🇿🇲","flag: Zambia"],["🇿🇼","flag: Zimbabwe"],["🏴󠁧󠁢󠁥󠁮󠁧󠁿","flag: England"],["🏴󠁧󠁢󠁳󠁣󠁴󠁿","flag: Scotland"],["🏴󠁧󠁢󠁷󠁬󠁳󠁿","flag: Wales"]]]];
// DATA END
// A value is ms:<icon name> or em:<emoji>. An empty value is the default icon of the thing that has it.
const COLS = 10, CELL = 36, HEAD = 28;
const EMOJI_TAB = { 'Smileys and Emotion': 'mood', 'People and Body': 'waving_hand', 'Animals and Nature': 'pets', 'Food and Drink': 'restaurant', 'Travel and Places': 'directions_car', Activities: 'sports_soccer', Objects: 'lightbulb', Symbols: 'favorite', Flags: 'flag' };
const prettyName = (n) => n.replace(/_/g, ' ');
// all entries once, in the order the chooser shows them
const ALL = (() => {
  const secs = [];
  EMOJI_GROUPS.forEach(([label, , list]) => secs.push({ id: 'e:' + label, label, tab: EMOJI_TAB[label], kind: 'Emoji', items: list.map(([ch, name]) => ({ v: 'em:' + ch, g: ch, em: true, name, lname: name.toLowerCase(), sec: label })) }));
  ICON_GROUPS.forEach(([label, tab, packed]) => secs.push({ id: 'i:' + label, label, tab, kind: 'Material icon', items: packed.split(';').map((s) => { const sp = s.indexOf(' '); const n = sp < 0 ? s : s.slice(0, sp); return { v: 'ms:' + n, g: n, em: false, name: prettyName(n), lname: prettyName(n), tags: sp < 0 ? '' : s.slice(sp + 1), sec: label }; }) }));
  return secs;
})();
const BY_VALUE = (() => { const m = new Map(); ALL.forEach((s) => s.items.forEach((it) => m.set(it.v, it))); return m; })();
const KIND_OF = (it) => (it.em ? 'Emoji · ' + it.sec : 'Material icon · ' + it.sec);

class Component extends DCLogic {
  renderVals() {
    const p = this.props, s = this.state || {};
    const set = (patch) => this.setState(patch);
    const uid = this._uid || (this._uid = 'ic' + Math.random().toString(36).slice(2, 8));
    const standalone = p.standalone ?? true;
    const value = s.value ?? (p.value || '');
    const q = s.q ?? (p.query || '');
    const ql = q.trim().toLowerCase();
    const recent = (p.recent || []).filter((v) => BY_VALUE.has(v)).slice(0, COLS * 2);
    const st = s.st || 0;
    const VIEW = 300;

    // ---------- sections: recently used, the emoji, the icons; or the search results ----------
    let secs;
    if (ql) {
      const words = ql.split(/\s+/);
      const hit = (it) => words.every((w) => it.lname.includes(w) || (it.tags && it.tags.includes(w)));
      const emo = [], ico = [];
      ALL.forEach((sec) => sec.items.forEach((it) => { if (hit(it)) (it.em ? emo : ico).push(it); }));
      secs = [];
      if (emo.length) secs.push({ id: 'r:e', label: 'Emoji', items: emo, count: emo.length });
      if (ico.length) secs.push({ id: 'r:i', label: 'Icons', items: ico, count: ico.length });
    } else {
      secs = (recent.length ? [{ id: 'recent', label: 'Recently Used', tab: 'schedule', items: recent.map((v) => BY_VALUE.get(v)) }] : []).concat(ALL);
    }
    // One layout per search: every row's top, so only the rows in view get drawn.
    const key = ql + '|' + recent.join(',');
    if (!this._lay || this._lay.key !== key) {
      const rows = [], starts = {};
      let y = 0;
      secs.forEach((sec) => {
        starts[sec.id] = y;
        rows.push({ head: true, top: y, sec }); y += HEAD;
        for (let i = 0; i < sec.items.length; i += COLS) { rows.push({ head: false, top: y, sec, items: sec.items.slice(i, i + COLS), first: i }); y += CELL; }
      });
      this._lay = { key, rows, starts, total: y + 6 };
    }
    const lay = this._lay;
    const flat = secs.reduce((a, sec) => a.concat(sec.items), []);
    const kb = s.kb !== undefined && ql ? Math.min(s.kb, flat.length - 1) : -1;
    const kbItem = kb >= 0 ? flat[kb] : null;
    const hoverItem = s.hover ? BY_VALUE.get(s.hover) : null;
    const cur = value ? BY_VALUE.get(value) : null;

    const deepQuery = (sel0) => { const walk = (r) => { const hit = r.querySelector(sel0); if (hit) return hit; for (const el of r.querySelectorAll('*')) { if (el.shadowRoot) { const x = walk(el.shadowRoot); if (x) return x; } } return null; }; return walk(document); };
    const grid = () => deepQuery('[data-grid="' + uid + '"]');
    const scrollTo = (y) => { const g = grid(); if (g) g.scrollTop = y; set({ st: y }); };
    // the search field has the focus as soon as the chooser opens, so typing searches right away
    if (!standalone && !this._focused) { this._focused = true; setTimeout(() => { const el = deepQuery('[data-fk="' + uid + '-q"]'); if (el) el.focus({ preventScroll: true }); }, 30); }
    const pick = (v) => { if (typeof p.onPick === 'function') p.onPick(v); else set({ value: v }); };

    // ---------- the rows in view ----------
    const vrows = [];
    lay.rows.forEach((r) => {
      if (r.top + CELL < st - 160 || r.top > st + VIEW + 160) return;
      if (r.head) { vrows.push({ head: true, cells: false, style: 'top: ' + r.top + 'px', label: r.sec.label, count: r.sec.count ? String(r.sec.count) : '' }); return; }
      vrows.push({
        head: false, cells: true, style: 'top: ' + r.top + 'px',
        items: r.items.map((it, i) => {
          const isKb = !!ql && kbItem === it;
          return {
            cls: 'ic-cell' + (it.v === value ? ' on' : '') + (isKb ? ' kb' : ''), name: it.name,
            g: it.g, gcls: it.em ? 'em' : 'ms all',
            pick: () => pick(it.v),
            hover: () => { if (this.state?.hover !== it.v) set({ hover: it.v }); }
          };
        })
      });
    });
    // the section at the top of the view stays pinned there
    let pinnedSec = null;
    secs.forEach((sec) => { if (lay.starts[sec.id] <= st + 1) pinnedSec = sec; });
    const pinned = pinnedSec && st > lay.starts[pinnedSec.id] ? pinnedSec.label : '';

    // ---------- tabs: one per section, emoji first ----------
    const tabs = [];
    if (!ql) {
      secs.forEach((sec) => {
        if (sec.id === 'i:' + ICON_GROUPS[0][0]) tabs.push({ sep: true, tab: false });
        const on = pinnedSec === sec || (!pinnedSec && sec === secs[0]);
        tabs.push({ sep: false, tab: true, cls: 'ic-tab' + (on ? ' on' : ''), on: on ? 'true' : 'false', label: sec.label, icon: sec.tab, go: () => scrollTo(lay.starts[sec.id]) });
      });
    }

    // ---------- footer: what the mouse is on, else what is chosen ----------
    const show = hoverItem || kbItem || cur;
    const pv = show ? { g: show.g, gcls: show.em ? 'em' : 'ms all', name: show.name, kind: KIND_OF(show) } : { g: p.defaultIcon || 'hearing', gcls: 'ms', name: 'Default icon', kind: 'Until you pick one' };

    const searchKey = (e) => {
      if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); if (q) set({ q: '', kb: undefined, st: 0 }); else if (typeof p.onClose === 'function') p.onClose(); return; }
      if (!flat.length) return;
      const moves = { ArrowRight: 1, ArrowLeft: -1, ArrowDown: COLS, ArrowUp: -COLS };
      if (moves[e.key] && ql) {
        e.preventDefault();
        const nk = Math.max(0, Math.min(flat.length - 1, (kb < 0 ? -moves[e.key] : kb) + moves[e.key]));
        // keep the highlighted icon in view
        const it = flat[nk]; const row = lay.rows.find((r) => !r.head && r.items.includes(it));
        let nst = st; if (row) { if (row.top < st + HEAD) nst = Math.max(0, row.top - HEAD); else if (row.top + CELL > st + VIEW) nst = row.top + CELL - VIEW; }
        if (nst !== st) { const g = grid(); if (g) g.scrollTop = nst; }
        set({ kb: nk, st: nst, hover: null });
        return;
      }
      if (e.key === 'Enter') { e.preventDefault(); pick((kbItem || flat[0]).v); }
    };

    return {
      uid, title: p.title || 'Icon',
      rootCls: standalone ? 'fm ' + ((p.theme ?? 'Dark') === 'Light' ? 'theme-light' : 'theme-dark') + ((p.material ?? 'Blur') === 'Blur' ? ' mat-blur' : '') : '',
      rootStyle: standalone ? 'position: relative; width: 480px; height: 540px; padding: 44px; box-sizing: border-box; background: var(--bd)' : '',
      pickStyle: standalone ? 'position: relative' : '',
      searchFk: uid + '-q', gridSk: uid + '-grid', q, showHint: !q,
      onSearch: (e) => { const g = grid(); if (g) g.scrollTop = 0; set({ q: e.target.value, kb: undefined, st: 0, hover: null }); },
      searchKey,
      // one redraw per frame at most while scrolling, with the latest position
      onScroll: (e) => { const g = e.currentTarget; if (this._scrollT) return; this._scrollT = setTimeout(() => { this._scrollT = 0; const y = g.scrollTop; if ((this.state || {}).st !== y) set({ st: y }); }, 16); },
      unhover: () => { if ((this.state || {}).hover) set({ hover: null }); },
      tabs, vrows, spaceStyle: 'height: ' + lay.total + 'px',
      pinned, pinnedCount: pinnedSec && pinnedSec.count ? String(pinnedSec.count) : '',
      noMatch: !!ql && !flat.length, noMatchText: 'No icon or emoji matches “' + q.trim() + '”.',
      pv,
      defCls: 'btn sm' + (!value ? ' on' : ''), defIcon: p.defaultIcon || 'hearing',
      defTip: value ? 'Go back to the default icon' : 'This uses the default icon',
      pickDefault: () => pick('')
    };
  }
}
