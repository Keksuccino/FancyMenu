<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Text editor editing a Text element</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="fm-ui.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&amp;family=Noto+Sans+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div class="fm {{themeClass}} {{matClass}}" style="position: relative; width: 1440px; height: 900px; overflow: hidden; background: var(--bd)">
<div class="backdrop" aria-hidden="true" style="background: #15182c"><img class="art" src="dusk_valley.png" alt=""><div class="gridlines"></div></div>
<div style="position: absolute; left: 0; right: 0; top: 0"><dc-import name="MenuBar" kind="Editor" unsaved="{{yes}}" standalone="{{no}}" hint-size="1440px,30px"></dc-import></div>
<div aria-label="Welcome Text element" style="position: absolute; left: 56px; top: 150px; width: 420px; padding: 10px 12px; color: #fff; text-shadow: 0 2px 0 rgba(0, 0, 0, .35)">
<sc-for list="{{pv}}" as="ln" hint-placeholder-count="6"><div style="{{ln.style}}"><sc-if value="{{ln.li}}" hint-placeholder-val="{{false}}"><span style="display: inline-block; width: 18px; color: #ffe066">•</span></sc-if><sc-for list="{{ln.parts}}" as="pt" hint-placeholder-count="2"><span style="{{pt.style}}">{{pt.s}}</span></sc-for></div></sc-for>
<div class="sel-border" aria-hidden="true" style="left: -1px; top: -1px; width: calc(100% + 2px); height: calc(100% + 2px)"><i style="left: -3px; top: -3px"></i><i style="right: -3px; top: -3px"></i><i style="left: -3px; bottom: -3px"></i><i style="right: -3px; bottom: -3px"></i></div>
</div>
<div style="position: absolute; left: 520px; top: 64px"><dc-import name="TextEditor" mode="Text" sidebar="{{sidebar}}" typing="{{typing}}" chip="{{chip}}" colors="{{colors}}" insert="{{insert}}" select="{{select}}" reset-key="{{resetKey}}" live-target="Welcome Text" width="880" height="800" standalone="{{no}}" preview-listener="{{onPreview}}" hint-size="880px,800px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"sidebar":{"editor":"boolean","default":true},"typing":{"editor":"boolean","default":false},"chip":{"editor":"int","default":-1},"colors":{"editor":"boolean","default":false},"insert":{"editor":"boolean","default":false},"select":{"editor":"text","default":""},"resetKey":{"editor":"int","default":0},"theme":{"editor":"enum","options":["Dark","Light"],"default":"Dark"},"material":{"editor":"enum","options":["Solid","Blur"],"default":"Blur"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {}, p = this.props;
    const KIND = {
      h1: 'font-size: 28px; font-weight: 700; line-height: 1.25; margin-bottom: 2px', h2: 'font-size: 22px; font-weight: 700; line-height: 1.3', h3: 'font-size: 18px; font-weight: 700; line-height: 1.35',
      gap: 'height: 10px', sep: 'height: 1px; margin: 8px 0; background: rgba(255, 255, 255, .45)', quote: 'font-size: 16px; line-height: 1.55; padding-left: 10px; border-left: 3px solid rgba(255, 255, 255, .5)',
      code: 'font-family: "Noto Sans Mono", monospace; font-size: 13px; line-height: 1.6; padding: 0 8px; background: rgba(0, 0, 0, .35)'
    };
    const pv = (s.pv || []).map((ln) => ({
      li: ln.kind === 'li',
      style: (KIND[ln.kind] || 'font-size: 16px; line-height: 1.55') + (ln.align ? '; text-align: ' + ln.align : ''),
      parts: ln.parts.map((pt) => ({ s: pt.s, style: (pt.b ? 'font-weight: 700;' : '') + (pt.i ? ' font-style: italic;' : '') + (pt.st || pt.u ? ' text-decoration: ' + [pt.u ? 'underline' : '', pt.st ? 'line-through' : ''].filter(Boolean).join(' ') + ';' : '') + (pt.code ? ' font-family: "Noto Sans Mono", monospace; font-size: .85em; padding: 0 4px; border-radius: 3px; background: rgba(0, 0, 0, .35);' : '') + (pt.col ? ' color: ' + pt.col + ';' : '') }))
    }));
    return {
      themeClass: (p.theme ?? 'Dark') === 'Light' ? 'theme-light' : 'theme-dark',
      matClass: (p.material ?? 'Blur') === 'Blur' ? 'mat-blur' : '',
      yes: true, no: false,
      sidebar: p.sidebar ?? true, typing: !!p.typing, chip: p.chip ?? -1, colors: !!p.colors, insert: !!p.insert, select: p.select || '', resetKey: +p.resetKey || 0,
      pv, onPreview: (out) => this.setState({ pv: out })
    };
  }
}
</script>
</body>
</html>
