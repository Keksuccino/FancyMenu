<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Choose Image file browser</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="fm-ui.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&amp;family=Noto+Sans+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1080px; height: 720px; overflow: hidden">
<dc-import name="FileBrowser" mode="Choose" kind="Images" selected="config/fancymenu/assets/backgrounds/dusk_valley.png" apply="{{yes}}" theme="{{theme}}" material="{{material}}" hint-size="1080px,720px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["Dark","Light"],"default":"Dark"},"material":{"editor":"enum","options":["Solid","Blur"],"default":"Blur"},"$preview":{"width":1080,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'Dark', material: this.props.material ?? 'Blur', yes: true };
  }
}
</script>
</body>
</html>
