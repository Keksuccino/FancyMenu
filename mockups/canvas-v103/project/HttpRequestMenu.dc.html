<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Edit HTTP Request with the method menu open</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="fm-ui.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&amp;family=Noto+Sans+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1200px; height: 920px; overflow: hidden">
<dc-import name="HttpRequest" menu-open="{{yes}}" hint-size="1200px,920px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1200,"height":920}}'>
class Component extends DCLogic {
  renderVals() {
    return { yes: true };
  }
}
</script>
</body>
</html>
