<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The whole setup</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="fm-ui.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&amp;family=Noto+Sans+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 1440px; height: 900px; overflow: hidden">
<div class="fm {{themeClass}} {{matClass}}" style="position: absolute; inset: 0; background: var(--bd)">
<div class="backdrop" aria-hidden="true" style="background: #15182c"><img class="art" src="dusk_valley.png" alt=""></div>
<div aria-hidden="true" style="position: absolute; left: 16px; bottom: 12px; color: rgba(255, 255, 255, .85); font-size: 12px">Dusk Valley Pack 1.4.2</div>
<div aria-hidden="true" style="position: absolute; right: 16px; bottom: 12px; color: rgba(255, 255, 255, .85); font-size: 12px">Copyright Mojang AB. Do not distribute!</div>
<div style="position: absolute; left: 0; right: 0; top: 0"><dc-import name="MenuBar" kind="Overlay" standalone="{{no}}" hint-size="1440px,30px"></dc-import></div>
</div>
<div class="fm {{themeClass}} {{matClass}}" style="position: absolute; z-index: 100; left: 290px; top: 150px"><dc-import name="ExportText" from="Setup" width="860" height="560" standalone="{{no}}" hint-size="860px,560px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["Dark","Light"],"default":"Dark"},"material":{"editor":"enum","options":["Solid","Blur"],"default":"Blur"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const p = this.props, theme = p.theme ?? 'Dark', material = p.material ?? 'Blur';
    return { theme, material, themeClass: theme === 'Light' ? 'theme-light' : 'theme-dark', matClass: material === 'Blur' ? 'mat-blur' : '', yes: true, no: false };
  }
}
</script>
</body>
</html>
