<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Menu bar component</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="fm-ui.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&amp;family=Noto+Sans+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div class="{{rootCls}}" style="{{rootStyle}}">
<sc-if value="{{standalone}}" hint-placeholder-val="{{true}}"><div class="backdrop" aria-hidden="true" style="background: #15182c"><img class="art" src="dusk_valley.png" alt=""></div></sc-if>
<div class="mb">
<sc-if value="{{catching}}" hint-placeholder-val="{{false}}"><div class="mb-catch" style="{{catchStyle}}" onClick="{{closeAll}}"></div></sc-if>

<sc-if value="{{expanded}}" hint-placeholder-val="{{true}}">
<div class="mbar" role="menubar" aria-label="FancyMenu menu bar">
<span class="mb-logo" role="img" aria-label="FancyMenu"><span class="fm-glyph" aria-hidden="true"></span></span>

<sc-for list="{{menus}}" as="m" hint-placeholder-count="4">
<div class="mb-item">
<button class="{{m.cls}}" role="menuitem" aria-haspopup="menu" aria-expanded="{{m.expanded}}" onClick="{{m.click}}" onMouseEnter="{{m.enter}}">{{m.label}}</button>
<sc-if value="{{m.isOpen}}" hint-placeholder-val="{{false}}">
<div class="mb-drop" onMouseMove="{{m.track}}">
<div><dc-import name="ContextMenu" items="{{m.items}}" search="{{m.search}}" focus-on-open="{{yes}}" search-listener="{{m.onQuery}}" escape-listener="{{closeAll}}" standalone="{{no}}" hint-size="auto,420px"></dc-import></div>
<sc-if value="{{m.hasSub}}" hint-placeholder-val="{{false}}"><div style="{{m.subStyle}}" onMouseEnter="{{m.subEnter}}"><dc-import name="ContextMenu" items="{{m.subItems}}" sub="{{yes}}" search="{{m.subSearch}}" max-height="{{m.subMax}}" escape-listener="{{closeAll}}" standalone="{{no}}" hint-size="auto,260px"></dc-import></div></sc-if>
<sc-if value="{{m.hasSub2}}" hint-placeholder-val="{{false}}"><div style="{{m.sub2Style}}"><dc-import name="ContextMenu" items="{{m.sub2Items}}" sub="{{yes}}" escape-listener="{{closeAll}}" standalone="{{no}}" hint-size="auto,220px"></dc-import></div></sc-if>
</div>
</sc-if>
</div>
</sc-for>

<sc-if value="{{isOverlay}}" hint-placeholder-val="{{true}}">
<button class="{{centerCls}}" data-tip="{{centerTip}}" aria-label="Copy the identifier of this screen" onClick="{{copyId}}" onMouseLeave="{{uncopy}}">
<span class="ms" aria-hidden="true">desktop_windows</span>
<span>Title Screen</span><span class="sid">{{sidText}}</span>
<sc-if value="{{copied}}" hint-placeholder-val="{{false}}"><span class="ms cp" aria-hidden="true">check</span></sc-if>
<sc-if value="{{notCopied}}" hint-placeholder-val="{{true}}"><span class="ms cp" aria-hidden="true">content_copy</span></sc-if>
</button>
</sc-if>
<sc-if value="{{isEditor}}" hint-placeholder-val="{{false}}">
<div class="mb-center" aria-label="Layout you are editing">
<span class="ms" aria-hidden="true">gallery_thumbnail</span>
<span>{{layoutName}}</span><span class="sub">— {{screenName}}</span>
</div>
</sc-if>

<div class="mb-right">
<sc-if value="{{isOverlay}}" hint-placeholder-val="{{true}}">
<button class="{{exitCls}}" data-tip="Close This Screen" aria-label="Close this screen" onClick="{{noop}}"><span class="ms" aria-hidden="true">exit_to_app</span></button>
</sc-if>
<sc-if value="{{isEditor}}" hint-placeholder-val="{{false}}">
<sc-if value="{{unsaved}}" hint-placeholder-val="{{true}}"><button class="mb-save" data-tip="Unsaved changes · Ctrl+S" onClick="{{save}}"><span class="dot" aria-hidden="true"></span>Save</button></sc-if>
<sc-if value="{{saved}}" hint-placeholder-val="{{false}}"><button class="mb-save saved" data-tip="All changes are saved" onClick="{{noop}}"><span class="ms" aria-hidden="true">check</span>Saved</button></sc-if>
<button class="mb-ic danger" data-tip="Close Editor" aria-label="Close editor" onClick="{{noop}}"><span class="ms" aria-hidden="true">close</span></button>
</sc-if>
<span class="mb-div" aria-hidden="true"></span>
<button class="mb-ic" data-tip="Collapse Menu Bar" aria-label="Collapse menu bar" onClick="{{collapse}}"><span class="ms" aria-hidden="true">expand_less</span></button>
</div>
</div>
</sc-if>

<sc-if value="{{isCollapsed}}" hint-placeholder-val="{{false}}">
<button class="mb-tab" data-tip="Show Menu Bar" aria-label="Show menu bar" onClick="{{expand}}">
<span class="fm-glyph" aria-hidden="true"></span>
<span class="ms chev" aria-hidden="true">expand_more</span>
</button>
</sc-if>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"kind":{"editor":"enum","options":["Overlay","Editor"],"default":"Overlay"},"open":{"editor":"text","default":""},"sub":{"editor":"text","default":""},"sub2":{"editor":"text","default":""},"unsaved":{"editor":"boolean","default":true},"collapsed":{"editor":"boolean","default":false},"customized":{"editor":"boolean","default":true},"layouts":{"editor":"enum","options":["Few","Many"],"default":"Few"},"layoutName":{"editor":"text","default":"Dusk Valley"},"screenName":{"editor":"text","default":"Title Screen"},"hoverTitle":{"editor":"text","default":""},"catchHeight":{"editor":"int","default":0},"frameHeight":{"editor":"int","default":520},"standalone":{"editor":"boolean","default":true},"theme":{"editor":"enum","options":["Dark","Light"],"default":"Dark"},"material":{"editor":"enum","options":["Solid","Blur"],"default":"Blur"},"$preview":{"width":1200,"height":520}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const p = this.props;
    const editor = (p.kind ?? 'Overlay') === 'Editor';
    const open = s.open !== undefined ? s.open : (p.open || null);
    const sub = s.sub !== undefined ? s.sub : (p.sub || null);
    // a row inside a submenu can open one more menu, like the tracks under Global Customizations
    const sub2 = s.sub2 !== undefined ? s.sub2 : (p.sub2 || null);
    const collapsed = s.collapsed ?? !!p.collapsed;
    const unsaved = s.unsaved ?? (p.unsaved ?? true);
    const cust = s.cust ?? (p.customized ?? true);
    // anchor overlay colors: empty means "use the UI theme's color"; the row still shows that color like any other value
    const THEME_BASE = '#25B479', THEME_BORDER = '#114F34';
    const baseColor = s.baseColor !== undefined ? s.baseColor : '';
    const set = (patch) => this.setState(patch);
    // Submenu hover intent. While a submenu is open and the pointer is heading toward it, crossing other rows
    // on the way doesn't switch or close it for a short grace time. Entering the submenu cancels the pending
    // switch; stopping on a row applies it once the grace time is over. Moving straight up or down (not toward
    // the submenu) still switches instantly, so the menu never feels laggy.
    const hi = this._hoverIntent || (this._hoverIntent = { pts: [], rect: null, timer: 0 });
    const GRACE_MS = 350;
    const cancelIntent = () => { if (hi.timer) { clearTimeout(hi.timer); hi.timer = 0; } };
    const track = (e) => {
      hi.pts.push({ x: e.clientX, y: e.clientY });
      if (hi.pts.length > 4) hi.pts.shift();
      const subMenu = e.currentTarget.querySelectorAll('.menu.cm')[1];
      hi.rect = subMenu ? subMenu.getBoundingClientRect() : null;
    };
    const headingToSub = () => {
      const r = hi.rect;
      if (!r || hi.pts.length < 2) return false;
      const pt = hi.pts[hi.pts.length - 1], from = hi.pts[0];
      if (pt.x === from.x && pt.y === from.y) return false;
      const a = { x: r.left, y: r.top - 8 }, b = { x: r.left, y: r.bottom + 8 };
      const side = (p1, p2, p3) => (p1.x - p3.x) * (p2.y - p3.y) - (p2.x - p3.x) * (p1.y - p3.y);
      const d1 = side(pt, from, a), d2 = side(pt, a, b), d3 = side(pt, b, from);
      return !((d1 < 0 || d2 < 0 || d3 < 0) && (d1 > 0 || d2 > 0 || d3 > 0));
    };
    const liveSub = () => { const st = this.state || {}; return st.sub !== undefined ? st.sub : (p.sub || null); };
    const wantSub = (id) => {
      cancelIntent();
      const cur = liveSub();
      if (cur === id) return;
      if (cur !== null && headingToSub()) {
        hi.timer = setTimeout(() => { hi.timer = 0; this.setState({ sub: id, sub2: null }); }, GRACE_MS);
        return;
      }
      set({ sub: id, sub2: null });
    };
    const liveSub2 = () => { const st = this.state || {}; return st.sub2 !== undefined ? st.sub2 : (p.sub2 || null); };
    const closeAll = () => { cancelIntent(); set({ open: null, sub: null, sub2: null }); };

    // ---------- shared submenus ----------
    const settings = { items: [
      { ic: 'power', label: 'Advanced Customization Mode', sw: true, on: true },
      { sep: true },
      { ic: 'tune', label: "FancyMenu's UI", sub: true },
      { sep: true },
      { ic: 'timer', label: 'Placeholder Caching', val: '30 ms' },
      { ic: 'timer', label: 'Condition Caching', val: '30 ms' },
      { sep: true },
      { ic: 'terminal', label: 'Developer', sub: true }
    ] };

    // ---------- customization overlay ----------
    // Layouts of this screen sit right in the menu while there are LAYOUTS_INLINE_MAX or fewer. Bigger setups
    // (random mode packs easily have 50) collapse into one "All Layouts" row with the count and a searchable submenu.
    const LAYOUTS_INLINE_MAX = 5;
    const PANORAMAS = ['Aurora Lake', 'Cherry Blossom Hill', 'Dusk Valley Night', 'Golden Hour', 'Snowy Peaks', 'Starfall Ridge'];
    const CUSTOM_GUIS = ['coin_shop', 'credits', 'intro_story', 'quest_log', 'server_hub', 'whats_new'];
    const gPano = s.gPano !== undefined ? s.gPano : 'Dusk Valley Night';
    const tracks = s.tracks ?? [['menu_theme.ogg', '2:48'], ['evening_fields.ogg', '3:12'], ['night_wind.ogg', '4:05']];
    const many = (p.layouts ?? 'Few') === 'Many';
    const slug = (n) => n.toLowerCase().replace(/[^a-z0-9]+/g, '_');
    const screenNames = many ? ['Dusk Valley', 'Winter Event', 'Spring Bloom', 'Autumn Leaves', 'Starfall'].concat(Array.from({ length: 42 }, (_, i) => 'Title Variant ' + String(i + 1).padStart(2, '0'))) : ['Dusk Valley', 'Winter Event'];
    const universalNames = many ? ['Watermark', 'Version Badge', 'Seasonal Snow', 'Discord Button', 'Credits Corner'] : ['Watermark'];
    const offByDefault = ['Winter Event', 'Starfall', 'Seasonal Snow'];
    const layouts = screenNames.map((name) => ({ name, universal: false })).concat(universalNames.map((name) => ({ name, universal: true })))
      .map((l) => ({ ...l, id: slug(l.name) }));
    const layOn = s.layOn ?? Object.fromEntries(layouts.map((l) => [l.id, !offByDefault.includes(l.name)]));
    const inlineLayouts = layouts.length <= LAYOUTS_INLINE_MAX;
    const onOff = (id) => (layOn[id] ? 'On' : 'Off');
    const manage = (id) => ({ items: [
      { ic: 'edit', label: 'Edit Layout' },
      { ic: 'toggle', label: 'Enabled', sw: true, on: layOn[id], onToggle: (v) => set({ layOn: { ...layOn, [id]: v } }) },
      { sep: true },
      { ic: 'editor', label: 'Rename Layout' },
      { ic: 'external', label: 'Open in System Text Editor' },
      { sep: true },
      { ic: 'trash', label: 'Delete Layout', danger: true }
    ] });
    const overlay = [
      { id: 'customization', label: 'Customization', ctx: true, items: [
        { head: 'This Screen' },
        { ic: 'toggle', label: 'Customize This Screen', sw: true, on: cust, onToggle: (v) => set({ cust: v }) },
        { ic: 'id', label: 'Copy Screen Identifier' },
        { ic: 'swipe', label: 'Expose Scroll Area Content', sw: true, on: false },
        { ic: 'link', label: 'Override With Custom GUI', subId: 'override' },
        { head: 'Layouts' },
        { ic: 'plus', label: 'New Layout', subId: 'newLayout' },
        ...(inlineLayouts
          ? layouts.map((l) => ({ ic: l.universal ? 'globe' : 'layout', label: l.name, tag: l.universal ? 'Universal' : '', val: onOff(l.id), subId: 'lay_' + l.id }))
          : [{ ic: 'layout', label: 'All Layouts', val: String(layouts.length), subId: 'allLayouts' }]),
        { head: 'Manage' },
        { ic: 'stack', label: 'Profiles' },
        { ic: 'tune', label: 'Global Customizations', subId: 'global' },
        { ic: 'gui', label: 'Custom GUIs' },
        { ic: 'var', label: 'Manage Variables' },
        { ic: 'ear', label: 'Manage Listeners' },
        { ic: 'timer', label: 'Manage Schedulers' },
        { ic: 'slideshow', label: 'Slideshows' },
        { ic: 'panorama', label: 'Panoramas' },
        { ic: 'check', label: 'Pre-Load Resources' },
        { head: 'FancyMenu' },
        { ic: 'gear', label: 'Settings', subId: 'settings' },
        { ic: 'reload', label: 'Reload FancyMenu', kbd: 'Ctrl+Alt+R' },
        { ic: 'reload', label: 'Reload Minecraft Resources' },
        { ic: 'eyeOff', label: 'Hide Menu Bar', kbd: 'Ctrl+Alt+C' },
        { sep: true },
        { ic: 'power', label: 'Kill-Switch Screen Customization', danger: true }
      ], subs: {
        newLayout: { items: [
          { ic: 'screen', label: 'For This Screen', disabled: !cust, note: cust ? '' : 'turn on customization first' },
          { ic: 'globe', label: 'For All Screens', tag: 'Universal' }
        ] },
        ...Object.fromEntries(inlineLayouts ? layouts.map((l) => ['lay_' + l.id, manage(l.id)]) : []),
        allLayouts: { max: 470, search: 'Search layouts', items: [
          { head: 'This Screen' },
          ...layouts.filter((l) => !l.universal).map((l) => ({ ic: 'layout', label: l.name, val: onOff(l.id), sub: true })),
          { head: 'Universal' },
          ...layouts.filter((l) => l.universal).map((l) => ({ ic: 'globe', label: l.name, val: onOff(l.id), sub: true }))
        ] },
        global: { items: [
          { ic: 'video', label: 'Game Intro', sub: true },
          { sep: true },
          { ic: 'image', label: 'Singleplayer World Icons', sw: true, on: true },
          { ic: 'image', label: 'Multiplayer Server Icons', sw: true, on: true },
          { ic: 'globe', label: 'Seamless World Loading', sw: true, on: false },
          { ic: 'sparkle', label: 'Achievement Toasts', sw: true, on: true },
          { sep: true },
          { ic: 'image', label: 'Custom Window Icon', sub: true },
          { ic: 'title', label: 'Custom Window Title', val: 'Dusk Valley' },
          { sep: true },
          { ic: 'ruler', label: 'Default GUI Scale', val: 'Auto' },
          { ic: 'fit', label: 'Force Fullscreen on Launch', sw: true, on: false },
          { sep: true },
          { ic: 'button', label: 'Custom Button Textures', sub: true },
          { ic: 'case', label: 'Button Labels', sub: true },
          { ic: 'volume', label: 'Custom Button Click Sound', val: 'None' },
          { ic: 'slider', label: 'Custom Slider Textures', sub: true },
          { ic: 'case', label: 'Slider Labels', sub: true },
          { sep: true },
          { ic: 'image', label: 'Custom Menu Background Texture', val: 'None' },
          { ic: 'panorama', label: 'Custom Menu Background Panorama', val: gPano || 'None', subId: 'gPano' },
          { sep: true },
          { ic: 'music_note', label: 'Play Vanilla Menu Music', sw: true, on: false },
          { ic: 'queue_music', label: 'Custom Menu Music Tracks', val: tracks.length ? String(tracks.length) : 'None', subId: 'gMusic' }
        ] },
        // Panoramas get picked right here instead of in a Choose Panorama window (rule 133). The pencil on a row
        // opens the Panoramas window on that panorama, and the last two rows make a new one or show them all (rule 168).
        gPano: { items: [
          { radio: true, checked: !gPano, label: 'None', click: () => set({ gPano: '' }) },
          { sep: true },
          ...PANORAMAS.map((n) => ({ radio: true, checked: gPano === n, label: n, click: () => set({ gPano: n }), editTip: 'Edit ' + n, onEdit: () => {} })),
          { sep: true },
          { ic: 'plus', label: 'New Panorama' },
          { ic: 'panorama', label: 'Manage Panoramas' }
        ] },
        // The tracks that replace Minecraft's menu music, managed in the menu instead of on a full screen (rule 131).
        gMusic: { items: [
          ...tracks.map((t) => ({ ic: 'music_note', label: t[0], play: true, val: t[1], removeTip: 'Remove Track', onRemove: () => set({ tracks: tracks.filter((x) => x !== t) }) })),
          ...(tracks.length ? [{ sep: true }] : []),
          { ic: 'plus', label: 'Add Track' },
          { ic: 'trash', label: 'Clear Tracks', danger: true, disabled: !tracks.length }
        ] },
        // Override With Custom GUI lists the custom GUIs itself instead of opening a list window (rule 135).
        override: { items: CUSTOM_GUIS.map((n) => ({ ic: 'gui', label: n })) },
        settings
      } },
      { id: 'tools', label: 'Tools', items: [
        { ic: 'widgets', label: 'Dummy Screen Instances', subId: 'dummy' },
        { ic: 'movie', label: 'AFMA Creator' },
        { sep: true },
        { ic: 'cube', label: 'Browse Game Resources' },
        { ic: 'folder', label: 'Open FancyMenu Directory' },
        { sep: true },
        { ic: 'terminal', label: 'Debug Overlay', sw: true, on: false, kbd: 'Ctrl+Alt+D' }
      ], subs: {
        dummy: { items: [
          { ic: 'screen', label: 'Connect Screen' },
          { ic: 'screen', label: 'Dirt Message Screen' },
          { ic: 'screen', label: 'Level Loading Screen' },
          { ic: 'screen', label: 'Progress Screen' }
        ] }
      } },
      { id: 'help', label: 'Help', items: [
        { ic: 'book', label: 'FancyMenu Docs/Wiki' },
        { ic: 'chat', label: 'Join the Discord' },
        { ic: 'bug', label: 'Report a Bug' },
        { ic: 'export', label: 'Export Setup as Text' },
        { sep: true },
        { ic: 'search', label: 'Find & Share Layouts on CurseForge' },
        { sep: true },
        { ic: 'heart', label: 'Keksuccino on Patreon' },
        { ic: 'coin', label: 'PayPal Tip Jar' },
        { sep: true },
        { ic: 'waving_hand', label: 'Welcome' },
        { ic: 'info', label: 'About' }
      ] }
    ];

    // ---------- layout editor ----------
    // The same element list, sections and icons as the editor toolbar's Add Element menu.
    const elementList = [
      { head: 'Basics' }, ['text_fields', 'Text'], ['image', 'Image'], ['smart_button', 'Button'], ['rectangle', 'Rectangle'], ['circle', 'Circle'],
      { head: 'Media' }, ['music_note', 'Audio'], ['smart_display', 'Video'], ['slideshow', 'Slideshow'], ['speaker', 'Music Controller'],
      { head: 'Interactive' }, ['sliders', 'Slider'], ['check_box', 'Checkbox'], ['text_ad', 'Text Input Field'], ['open_with', 'Dragger'], ['web', 'Browser'],
      { head: 'Game' }, ['deployed_code', 'Item'], ['person', 'Player Entity'], ['view_in_ar', 'Block/Item JSON Model'],
      { head: 'More' }, ['flare', 'Splash Text'], ['tooltip', 'Tooltip'], ['linear_scale', 'Progress Bar'], ['arrow_selector_tool', 'Cursor'], ['timer', 'Ticker'], ['wand_stars', 'GLSL Shader']
    ].map((it) => (Array.isArray(it) ? { ic: it[0], label: it[1] } : it));
    const radios = (labels, cur) => labels.map((label) => ({ radio: true, checked: label === cur, label }));
    const editorMenus = [
      { id: 'layout', label: 'Layout', ctx: true, items: [
        { ic: 'plus', label: 'New' },
        { ic: 'folder', label: 'Open', subId: 'open' },
        { sep: true },
        { ic: 'save', label: 'Save', kbd: 'Ctrl+S', click: () => set({ unsaved: false, open: null, sub: null }) },
        { ic: 'saveas', label: 'Save As', kbd: 'Ctrl+Shift+S' },
        { ic: 'export', label: 'Export as Text' },
        { sep: true },
        { ic: 'settings', label: 'Layout Properties', subId: 'props' },
        { ic: 'gear', label: 'Settings', subId: 'settings' },
        { sep: true },
        { ic: 'close', label: 'Close Editor' }
      ], subs: {
        open: { items: [
          { ic: 'layout', label: 'Dusk Valley', note: 'open now', disabled: true },
          { ic: 'layout', label: 'Winter Event' },
          { ic: 'globe', label: 'Watermark', tag: 'Universal' }
        ] },
        props: { items: [
          { ic: 'image', label: 'Menu Backgrounds', val: 'Image', sub: true },
          { ic: 'sparkle', label: 'Decoration Overlays', sub: true },
          { ic: 'header', label: 'Header/Footer Customizations', sub: true },
          { ic: 'title', label: 'Custom Screen Title', val: 'Dusk Valley' },
          { sep: true },
          { ic: 'index', label: 'Layout Index', val: '0' },
          { ic: 'check', label: 'Loading Conditions', val: 'None' },
          { ic: 'behind', label: 'Custom Elements Behind Vanilla', sw: true, on: false }
        ] },
        settings
      } },
      { id: 'edit', label: 'Edit', items: [
        { ic: 'undo', label: 'Undo Move Play', kbd: 'Ctrl+Z' },
        { ic: 'redo', label: 'Redo', kbd: 'Ctrl+Shift+Z', disabled: true },
        { sep: true },
        { ic: 'cut', label: 'Cut', kbd: 'Ctrl+X' },
        { ic: 'copy', label: 'Copy', kbd: 'Ctrl+C' },
        { ic: 'paste', label: 'Paste', kbd: 'Ctrl+V' },
        { ic: 'library_add', label: 'Duplicate', kbd: 'Ctrl+D' },
        { sep: true },
        { ic: 'selectAll', label: 'Select All', kbd: 'Ctrl+A' },
        { ic: 'deselect', label: 'Select None', kbd: 'Esc' },
        { sep: true },
        { ic: 'trash', label: 'Delete', kbd: 'Del', danger: true }
      ] },
      { id: 'element', label: 'Element', items: [
        { ic: 'plus', label: 'Add Element', subId: 'newElement' },
        { sep: true },
        { ic: 'align_horizontal_left', label: 'Align', subId: 'align' },
        { ic: 'horizontal_distribute', label: 'Distribute', subId: 'dist', disabled: true, note: 'needs 3 elements' },
        { sep: true },
        { ic: 'flip_to_front', label: 'Bring to Front', kbd: 'Ctrl+Shift+Up' },
        { ic: 'up', label: 'Bring Forward', kbd: 'Ctrl+Up' },
        { ic: 'down', label: 'Send Backward', kbd: 'Ctrl+Down' },
        { ic: 'behind', label: 'Send to Back', kbd: 'Ctrl+Shift+Down' },
        { sep: true },
        { ic: 'folder', label: 'Group', kbd: 'Ctrl+G' },
        { ic: 'folder_off', label: 'Ungroup', kbd: 'Ctrl+Shift+G', disabled: true },
        { sep: true },
        { ic: 'lock', label: 'Lock', kbd: 'Ctrl+Shift+L' },
        { ic: 'visibility_off', label: 'Hide in Editor', kbd: 'Ctrl+Shift+H' }
      ], subs: {
        newElement: { items: elementList, search: 'Search 23 elements', max: 470 },
        align: { items: [
          { ic: 'align_horizontal_left', label: 'Left Edges' }, { ic: 'align_horizontal_center', label: 'Centers' }, { ic: 'align_horizontal_right', label: 'Right Edges' },
          { sep: true },
          { ic: 'align_vertical_top', label: 'Top Edges' }, { ic: 'align_vertical_center', label: 'Middles' }, { ic: 'align_vertical_bottom', label: 'Bottom Edges' },
          { sep: true },
          { ic: 'fit_screen', label: 'Align to the Screen', sw: true, on: true, note: 'with one element' }
        ] },
        dist: { items: [{ ic: 'horizontal_distribute', label: 'Same Space Across' }, { ic: 'vertical_distribute', label: 'Same Space Down' }] }
      } },
      { id: 'view', label: 'View', items: [
        { ic: 'zoom_in', label: 'Zoom In', kbd: 'Ctrl+Plus' },
        { ic: 'zoom_out', label: 'Zoom Out', kbd: 'Ctrl+Minus' },
        { ic: 'fit_screen', label: 'Zoom to Fit', kbd: 'Shift+1' },
        { ic: 'aspect_ratio', label: 'Actual Size', kbd: 'Ctrl+0' },
        { ic: 'desktop_windows', label: 'Screen Size', val: 'This Window', subId: 'size' },
        { head: 'Panels' },
        { ic: 'left_panel_open', label: 'Layers', sw: true, on: true },
        { ic: 'right_panel_open', label: 'Inspector', sw: true, on: true },
        { ic: 'bottom_panel_open', label: 'Timeline', sw: true, on: false },
        { ic: 'fullscreen', label: 'Hide All Panels', kbd: 'Tab' },
        { head: 'Canvas' },
        { ic: 'straighten', label: 'Rulers', sw: true, on: true, kbd: 'Shift+R' },
        { ic: 'grid', label: 'Grid', sw: true, on: true, kbd: 'Shift+G' },
        { ic: 'grid_4x4', label: 'Grid Size', val: '10 px', subId: 'gridSize' },
        { ic: 'grid_guides', label: 'Snapping', val: 'Grid, Elements, Screen', subId: 'snapping' },
        { ic: 'crop_square', label: 'Element Outlines', val: 'Always', subId: 'outlines' },
        { ic: 'anchor', label: 'Anchor Overlay', val: 'While Dragging', subId: 'anchorOv' },
        { ic: 'rotate', label: 'Rotation Handles', sw: true, on: true },
        { ic: 'tilt', label: 'Tilt Handles', sw: true, on: false },
        { ic: 'layers', label: 'Show Other Active Layouts', sw: true, on: false }
      ], subs: {
        size: { items: [
          { radio: true, checked: true, label: 'This Window', val: '1440 × 900 · GUI Scale 2' },
          { radio: true, checked: false, label: '1280 × 720', val: 'GUI Scale 2' },
          { radio: true, checked: false, label: '1920 × 1080', val: 'GUI Scale 3' },
          { radio: true, checked: false, label: '1024 × 768', val: 'GUI Scale 2' },
          { radio: true, checked: false, label: '2560 × 1440', val: 'GUI Scale 2' },
          { sep: true },
          { ic: 'edit', label: 'Custom Size' }
        ] },
        gridSize: { items: radios(['5 px', '10 px', '20 px', '25 px', '50 px'], '10 px') },
        snapping: { items: [
          { ic: 'grid_guides', label: 'Snapping', sw: true, on: true, kbd: 'Shift+S' },
          { sep: true },
          { ic: 'grid', label: 'Snap to Grid', sw: true, on: true },
          { ic: 'select_all', label: 'Snap to Elements', sw: true, on: true },
          { ic: 'fit_screen', label: 'Snap to Screen Edges and Center', sw: true, on: true },
          { ic: 'tune', label: 'Strength', slider: .4, sliderText: '1.0×' }
        ] },
        outlines: { items: radios(['Always', 'On Hover', 'Never'], 'Always') },
        anchorOv: { items: [
          { head: 'Show' },
          ...radios(['Never', 'While Dragging', 'Always', 'While Holding O'], 'While Dragging'),
          { sep: true },
          { ic: 'link', label: 'Show All Connections', sw: true, on: false },
          { ic: 'mouse', label: 'Anchor Area Hovering', sw: true, on: true },
          { ic: 'cursor', label: 'Anchor Element Hovering', sw: true, on: true },
          { ic: 'timer', label: 'Hover Charging Time', slider: 1 / 19, sliderText: '2 s' },
          { ic: 'invert', label: 'Invert Background Colors', sw: true, on: false },
          { ic: 'palette', label: 'Base Color', swatch: baseColor || THEME_BASE, val: baseColor || THEME_BASE, changed: !!baseColor, onReset: () => set({ baseColor: '' }) },
          { ic: 'rect', label: 'Border Color', swatch: THEME_BORDER, val: THEME_BORDER },
          { ic: 'opacity', label: 'Opacity', slider: 0.5 },
          { ic: 'opacity', label: 'Opacity While Dragging', slider: 0.8 }
        ] }
      } },
      overlay[2]
    ];

    // ---------- wiring ----------
    const heightOf = (it) => (it.sep || it.head ? 25 : 26);
    // same rule as ContextMenu: the search field shows from the start in menus with more than 10 entries
    const searchShown = (items) => items.filter((it) => !it.sep && !it.head).length > 10;
    // Top-level rows open or close the submenu on hover. Rows inside a submenu only get their click
    // action: giving them the top-level "close the submenu" hover would close it as soon as the pointer enters it.
    const wire = (items, level, subs) => items.map((it) => {
      const inSub = level > 0;
      if (it.sep || it.head) return it;
      const out = { ...it };
      // one level down, a row with a submenu opens it next to the submenu it's in
      if (it.subId && level === 1 && subs && subs[it.subId]) {
        out.sub = true;
        out.hl = sub2 === it.subId;
        out.enter = () => { if (liveSub2() !== it.subId) set({ sub2: it.subId }); };
        return out;
      }
      if (level === 1) out.enter = () => { if (liveSub2() !== null) set({ sub2: null }); };
      if (it.subId && !inSub) {
        out.sub = true;
        out.hl = sub === it.subId;
        out.enter = () => wantSub(it.disabled ? null : it.subId);
        return out;
      }
      if (!inSub) out.enter = () => wantSub(null);
      if (!it.sw && !it.sub && it.slider === undefined && !it.disabled && !it.click && !it.onRemove) out.click = closeAll;
      return out;
    });
    const menus = (editor ? editorMenus : overlay).map((d) => {
      const isOpen = open === d.id;
      const subDef = isOpen && sub && d.subs ? d.subs[sub] : null;
      let subStyle = '', sub2Style = '';
      const sub2Def = subDef && sub2 && d.subs[sub2] && subDef.items.some((it) => it.subId === sub2) ? d.subs[sub2] : null;
      if (subDef) {
        let y = 0;
        for (const it of d.items) {
          if (it.subId === sub) break;
          y += heightOf(it);
        }
        const want = 6 + (searchShown(d.items) ? 28 : 0) + y - 6;
        // a submenu low in a long menu moves up so it stays inside the window: its column starts 60 px below the
        // window's top edge, and it keeps an 8 px margin to the bottom edge
        const subH = subDef.items.reduce((a, it) => a + heightOf(it), 0) + 12 + (subDef.search || searchShown(subDef.items) ? 28 : 0);
        const room = (p.catchHeight || p.frameHeight || 900) - 60 - 8;
        const top1 = Math.max(0, Math.min(want, room - subH));
        subStyle = 'margin-top: ' + top1 + 'px';
        if (sub2Def) {
          let y2 = 0;
          for (const it of subDef.items) {
            if (it.subId === sub2) break;
            y2 += heightOf(it);
          }
          const want2 = top1 + (subDef.search || searchShown(subDef.items) ? 28 : 0) + y2;
          const sub2H = sub2Def.items.reduce((a, it) => a + heightOf(it), 0) + 12;
          sub2Style = 'margin-top: ' + Math.max(0, Math.min(want2, room - sub2H)) + 'px';
        }
      }
      return {
        label: d.label,
        cls: 'mb-t' + (d.ctx ? ' ctx' : '') + (isOpen ? ' open' : '') + (!open && p.hoverTitle === d.id ? ' hov' : ''),
        expanded: isOpen ? 'true' : 'false',
        click: () => (isOpen ? closeAll() : (cancelIntent(), set({ open: d.id, sub: null, sub2: null }))),
        enter: () => { if (open && open !== d.id) { cancelIntent(); set({ open: d.id, sub: null, sub2: null }); } },
        track, subEnter: cancelIntent,
        onQuery: (v) => { if (v && liveSub() !== null) { cancelIntent(); set({ sub: null }); } },
        isOpen, items: isOpen ? wire(d.items, 0, d.subs) : [], search: d.search || '',
        hasSub2: !!sub2Def, sub2Items: sub2Def ? wire(sub2Def.items, 2) : [], sub2Style,
        hasSub: !!subDef, subItems: subDef ? wire(subDef.items, 1, d.subs) : [], subSearch: (subDef && subDef.search) || '', subMax: (subDef && subDef.max) || 0, subStyle
      };
    });

    const standalone = p.standalone ?? true;
    const copied = !!s.copied;
    const catchH = p.catchHeight || 0;
    return {
      rootCls: standalone ? 'fm ' + ((p.theme ?? 'Dark') === 'Light' ? 'theme-light' : 'theme-dark') + ((p.material ?? 'Blur') === 'Blur' ? ' mat-blur' : '') : '',
      rootStyle: standalone ? 'position: relative; height: ' + (p.frameHeight || 520) + 'px; overflow: hidden; background: var(--bd)' : 'position: relative',
      standalone, no: false, yes: true,
      catching: !!open && catchH > 0, catchStyle: 'height: ' + catchH + 'px', closeAll,
      expanded: !collapsed, isCollapsed: collapsed,
      menus,
      isOverlay: !editor, isEditor: editor,
      centerCls: 'mb-center' + (copied ? ' copied' : ''), centerTip: copied ? 'Copied' : 'Click to copy the identifier',
      sidText: copied ? 'copied' : 'title_screen', copied, notCopied: !copied,
      // the layout that's open in the editor, and the screen it's for
      layoutName: p.layoutName || 'Dusk Valley', screenName: p.screenName || 'Title Screen',
      copyId: () => set({ copied: true }), uncopy: () => { if (copied) set({ copied: false }); },
      exitCls: 'mb-ic',
      unsaved, saved: !unsaved, save: () => set({ unsaved: false }),
      collapse: () => set({ collapsed: true, open: null, sub: null }), expand: () => set({ collapsed: false }),
      noop: () => {}
    };
  }
}
</script>
