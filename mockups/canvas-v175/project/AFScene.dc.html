<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AFMA Creator on the title screen</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="fm-ui.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&amp;family=Noto+Sans+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div class="fm {{themeClass}} {{matClass}}" style="position: relative; width: 1440px; height: 900px; overflow: hidden; background: var(--bd)">
<div class="backdrop" aria-hidden="true" style="background: #15182c"><img class="art" src="dusk_valley.png" alt=""></div>
<div aria-hidden="true" style="position: absolute; left: 16px; bottom: 12px; color: rgba(255, 255, 255, .85); font-size: 12px">Dusk Valley Pack 1.4.2</div>
<div aria-hidden="true" style="position: absolute; right: 16px; bottom: 12px; color: rgba(255, 255, 255, .85); font-size: 12px">Copyright Mojang AB. Do not distribute!</div>
<div style="position: absolute; left: 0; right: 0; top: 0"><dc-import name="MenuBar" kind="Overlay" standalone="{{no}}" hint-size="1440px,30px"></dc-import></div>
<div style="position: absolute; left: 200px; top: 110px"><dc-import name="AfmaCreator" scene="{{scene}}" at="{{at}}" paused="{{paused}}" job="{{job}}" job-at="{{jobAt}}" freeze="{{freeze}}" sheet="{{sheet}}" preset="{{preset}}" adv-open="{{advOpen}}" tuned="{{tuned}}" exists="{{exists}}" width="1040" height="680" standalone="{{no}}" hint-size="1040px,680px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"scene":{"editor":"enum","options":["Ready","Empty","Problems"],"default":"Ready"},"at":{"editor":"int","default":0},"paused":{"editor":"boolean","default":false},"job":{"editor":"enum","options":["","run","done"],"default":""},"jobAt":{"editor":"int","default":0},"freeze":{"editor":"boolean","default":false},"sheet":{"editor":"enum","options":["","close"],"default":""},"preset":{"editor":"enum","options":["best","balanced","small"],"default":"balanced"},"advOpen":{"editor":"boolean","default":false},"tuned":{"editor":"boolean","default":false},"exists":{"editor":"boolean","default":false},"theme":{"editor":"enum","options":["Dark","Light"],"default":"Dark"},"material":{"editor":"enum","options":["Solid","Blur"],"default":"Blur"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    return {
      themeClass: (p.theme ?? 'Dark') === 'Light' ? 'theme-light' : 'theme-dark',
      matClass: (p.material ?? 'Blur') === 'Blur' ? 'mat-blur' : '',
      no: false,
      scene: p.scene || 'Ready', at: +p.at || 0, paused: !!p.paused, job: p.job || '', jobAt: +p.jobAt || 0, freeze: !!p.freeze,
      sheet: p.sheet || '', preset: p.preset || 'balanced', advOpen: !!p.advOpen, tuned: !!p.tuned, exists: !!p.exists
    };
  }
}
</script>
</body>
</html>
