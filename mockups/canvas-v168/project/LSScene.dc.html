<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Listeners on the title screen</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="fm-ui.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&amp;family=Noto+Sans+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.mc-toast{position:absolute;right:18px;top:46px;width:300px;padding:10px 14px 11px;background:#212121;border:2px solid #555;box-shadow:inset 0 0 0 2px #2f2f2f;color:#fff;font-size:12.5px;line-height:1.35;animation:mc-toast-in .25s cubic-bezier(.2,.8,.3,1)}
.mc-toast b{display:block;color:#ffff55;font-weight:600}
@keyframes mc-toast-in{from{transform:translateX(330px)}to{transform:none}}
</style>
</helmet>
<div class="fm {{themeClass}} {{matClass}}" style="position: relative; width: 1440px; height: 900px; overflow: hidden; background: var(--bd)">
<div class="backdrop" aria-hidden="true" style="background: #15182c"><img class="art" src="dusk_valley.png" alt=""></div>
<div aria-hidden="true">
<div style="position: absolute; left: 112px; top: 610px; width: 6px; height: 6px; background: #ffe38c"></div>
<div style="position: absolute; left: 182px; top: 668px; width: 6px; height: 6px; background: #ffe38c"></div>
<div style="position: absolute; left: 1264px; top: 640px; width: 6px; height: 6px; background: #ffe38c"></div>
<div style="position: absolute; left: 1330px; top: 700px; width: 6px; height: 6px; background: #ffe38c"></div>
</div>
<div aria-hidden="true" style="position: absolute; left: 16px; bottom: 12px; color: rgba(255, 255, 255, .85); font-size: 12px">Dusk Valley Pack 1.4.2</div>
<div aria-hidden="true" style="position: absolute; right: 16px; bottom: 12px; color: rgba(255, 255, 255, .85); font-size: 12px">Copyright Mojang AB. Do not distribute!</div>
<div style="position: absolute; left: 0; right: 0; top: 0"><dc-import name="MenuBar" kind="Overlay" standalone="{{no}}" hint-size="1440px,30px"></dc-import></div>
<div style="position: absolute; left: 250px; top: 70px"><dc-import name="ListenersManager" scene="{{scene}}" select="{{select}}" menu="{{menu}}" menu-sub="{{menuSub}}" menu-help="{{menuHelp}}" filter="{{filter}}" filter-menu="{{filterMenu}}" query="{{query}}" icon-open="{{iconOpen}}" icon-query="{{iconQuery}}" room="830" on-toast="{{onToast}}" width="940" height="760" standalone="{{no}}" hint-size="940px,760px"></dc-import></div>
<sc-if value="{{toast}}" hint-placeholder-val="{{false}}"><div class="mc-toast" role="status"><b>{{toast}}</b>Show Toast, from a listener script</div></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"scene":{"editor":"enum","options":["Dusk Valley","Empty"],"default":"Dusk Valley"},"select":{"editor":"text","default":"l1"},"menu":{"editor":"enum","options":["","new","change","add","run"],"default":""},"menuSub":{"editor":"text","default":""},"menuHelp":{"editor":"text","default":""},"filter":{"editor":"enum","options":["all","off","probs","ran","never"],"default":"all"},"filterMenu":{"editor":"boolean","default":false},"query":{"editor":"text","default":""},"iconOpen":{"editor":"boolean","default":false},"iconQuery":{"editor":"text","default":""},"theme":{"editor":"enum","options":["Dark","Light"],"default":"Dark"},"material":{"editor":"enum","options":["Solid","Blur"],"default":"Blur"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  componentWillUnmount() { if (this._toastT) clearTimeout(this._toastT); }
  renderVals() {
    const p = this.props, s = this.state || {};
    return {
      themeClass: (p.theme ?? 'Dark') === 'Light' ? 'theme-light' : 'theme-dark',
      matClass: (p.material ?? 'Blur') === 'Blur' ? 'mat-blur' : '',
      yes: true, no: false,
      // Run Now on a script with Show Toast shows the toast on the screen behind the window, like the real action.
      toast: s.toast || '',
      onToast: (text) => { if (this._toastT) clearTimeout(this._toastT); this.setState({ toast: '' }); setTimeout(() => this.setState({ toast: text }), 0); this._toastT = setTimeout(() => this.setState({ toast: '' }), 4000); },
      scene: p.scene || 'Dusk Valley', select: p.select ?? 'l1', menu: p.menu || '', menuSub: p.menuSub || '', menuHelp: p.menuHelp || '',
      filter: p.filter || 'all', filterMenu: !!p.filterMenu, query: p.query || '', iconOpen: !!p.iconOpen, iconQuery: p.iconQuery || ''
    };
  }
}
</script>
</body>
</html>
