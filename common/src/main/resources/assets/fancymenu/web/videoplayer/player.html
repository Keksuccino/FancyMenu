<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FancyMenu Video Player</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #000000;
        }

        #videoContainer {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        video {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        
        /* Explicitly hide any video controls immediately */
        video::-webkit-media-controls,
        video::-webkit-media-controls-enclosure,
        video::-webkit-media-controls-panel,
        video::-webkit-media-controls-panel-container,
        video::-webkit-media-controls-play-button,
        video::-webkit-media-controls-overlay-play-button {
            display: none !important;
            opacity: 0 !important;
            pointer-events: none !important;
        }

        /* When fillScreen is enabled */
        .fill-screen video {
            object-fit: cover;
            width: 100%;
            height: 100%;
        }

        /* When aspect ratio should not be preserved */
        .stretch video {
            object-fit: fill;
            width: 100%;
            height: 100%;
        }
        
        /* Hide the loader completely */
        #loader {
            display: none !important;
            visibility: hidden !important;
            opacity: 0 !important;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        
        .spinner {
            display: none !important;
            visibility: hidden !important;
            opacity: 0 !important;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="videoContainer">
        <video id="videoPlayer" playsinline webkit-playsinline controlslist="nodownload nofullscreen noremoteplayback" nocontrols></video>
    </div>
    
    <!-- Loader is hidden but kept in DOM for JS functionality -->
    <div id="loader" style="display:none !important;">
        <div class="spinner"></div>
        <div id="loaderText"></div>
    </div>

    <script>
        // Debug mode flag - set to false to disable debug logging
        const DEBUG_ENABLED = false;
        
        // Log function that only outputs to console if debug is enabled
        function log(message) {
            if (DEBUG_ENABLED) {
                console.log(message);
            }
        }
        
        // Error logger - always logs regardless of debug setting
        function logError(message) {
            console.error("[FANCYMENU VIDEO] " + message);
        }
        
        // Ensure all required elements exist
        function ensureElementsExist() {
            // Ensure video container exists
            if (!document.getElementById('videoContainer')) {
                const container = document.createElement('div');
                container.id = 'videoContainer';
                container.style.width = '100%';
                container.style.height = '100%';
                container.style.display = 'flex';
                container.style.justifyContent = 'center';
                container.style.alignItems = 'center';
                container.style.position = 'relative';
                document.body.appendChild(container);
                log("Created missing videoContainer element");
            }
            
            // Ensure video player exists
            if (!document.getElementById('videoPlayer')) {
                const videoElement = document.createElement('video');
                videoElement.id = 'videoPlayer';
                videoElement.setAttribute('playsinline', '');
                videoElement.setAttribute('webkit-playsinline', '');
                document.getElementById('videoContainer').appendChild(videoElement);
                log("Created missing videoPlayer element");
                
                // Setup initial settings for newly created video element
                videoElement.volume = initialVolume;
                videoElement.loop = initialLoop;
                videoElement.setAttribute('controlslist', 'nodownload nofullscreen noremoteplayback');
                videoElement.setAttribute('nocontrols', '');
                videoElement.controls = false;
                videoElement.autoplay = autoPlay;
            }
            
            // Ensure loader exists (but stays hidden)
            if (!document.getElementById('loader')) {
                const loader = document.createElement('div');
                loader.id = 'loader';
                loader.style.position = 'absolute';
                loader.style.top = '50%';
                loader.style.left = '50%';
                loader.style.transform = 'translate(-50%, -50%)';
                loader.style.display = 'none';
                loader.style.visibility = 'hidden';
                loader.style.opacity = '0';
                
                const spinner = document.createElement('div');
                spinner.className = 'spinner';
                spinner.style.display = 'none';
                spinner.style.visibility = 'hidden';
                spinner.style.opacity = '0';
                
                const loaderText = document.createElement('div');
                loaderText.id = 'loaderText';
                loaderText.style.display = 'none';
                loaderText.style.visibility = 'hidden';
                loaderText.style.opacity = '0';
                
                loader.appendChild(spinner);
                loader.appendChild(loaderText);
                document.body.appendChild(loader);
                log("Created missing loader element (hidden)");
            }
            
            return {
                videoContainer: document.getElementById('videoContainer'),
                videoPlayer: document.getElementById('videoPlayer'),
                loader: document.getElementById('loader'),
                loaderText: document.getElementById('loaderText')
            };
        }
        
        // Call function to ensure all elements exist
        const elements = ensureElementsExist();
        const videoContainer = elements.videoContainer;
        const videoPlayer = elements.videoPlayer;
        const loader = elements.loader;
        const loaderText = elements.loaderText;
        
        function applyFitClasses(preserveAspectRatio, fillScreen) {
            if (!preserveAspectRatio) {
                videoContainer.classList.add('stretch');
                videoContainer.classList.remove('fill-screen');
                return;
            }

            videoContainer.classList.remove('stretch');
            if (fillScreen) {
                videoContainer.classList.add('fill-screen');
            } else {
                videoContainer.classList.remove('fill-screen');
            }
        }

        // Every asynchronous operation belongs to exactly one load context. Incrementing the generation even for
        // same-source reloads is important because the requested source alone cannot distinguish their callbacks.
        let loadGeneration = 0;
        let activeLoad = null;
        let disposed = false;
        
        // Parse URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const initialVolume = parseFloat(urlParams.get('volume')) || 1.0;
        const initialLoop = urlParams.get('loop') === 'true';
        const initialFillScreen = urlParams.get('fillScreen') === 'true';
        const preserveAspectRatioParam = urlParams.get('preserveAspectRatio');
        const initialPreserveAspectRatio = (preserveAspectRatioParam === null) ? true : preserveAspectRatioParam === 'true';
        // 'autoPlay' param means "should this video attempt to play as soon as it's loaded?"
        const wantsAutoplay = urlParams.get('autoPlay') !== 'false'; // Default to true if not specified or not 'false'
        const initialVideoPath = urlParams.get('video') || '';

        videoPlayer.volume = initialVolume;
        videoPlayer.loop = initialLoop;
        videoPlayer.controls = false; // Hide controls by default
        // videoPlayer.autoplay = wantsAutoplay; // We'll handle autoplay more explicitly

        applyFitClasses(initialPreserveAspectRatio, initialFillScreen);

        // Make sure loader is always hidden
        if (loader) {
            loader.style.display = 'none';
            loader.style.visibility = 'hidden';
            loader.style.opacity = '0';
        }

        window.videoPlayerAPI = {
            currentSettings: {
                volume: initialVolume,
                loop: initialLoop,
                fillScreen: initialFillScreen,
                preserveAspectRatio: initialPreserveAspectRatio,
                muted: videoPlayer.muted, // Reflect actual initial muted state (browsers might force mute for autoplay)
                videoLoadedAndReady: false, // True when video can actually start playing
                playRequestPending: wantsAutoplay, // If initially wants autoplay, treat as a pending play request
                currentVideoSrc: initialVideoPath // Store the src for reference
            },

            loadVideo: function(path) {
                if (disposed) {
                    log('Ignoring loadVideo() because the player has been disposed.');
                    return false;
                }

                const source = normalizeVideoSource(path);
                log(`API called: loadVideo(${source})`);
                const load = beginVideoLoad(source);
                if (!source) {
                    this.currentSettings.playRequestPending = false;
                    return true;
                }

                if (isCurrentLoad(load)) {
                    internalLoadVideo(load);
                }
                return true;
            },

            dispose: function() {
                disposeVideoPlayer();
                return true;
            },

            play: function() {
                if (disposed) {
                    log('Ignoring play() because the player has been disposed.');
                    return false;
                }
                log('API called: play()');
                this.currentSettings.playRequestPending = true;
                if (this.currentSettings.videoLoadedAndReady) {
                    log('Video ready, attempting to play immediately.');
                    tryPlayVideo();
                } else {
                    log('Video not ready, play request queued.');
                    // If src is set but not loading, try to kickstart it
                    if (videoPlayer.currentSrc && videoPlayer.readyState < HTMLMediaElement.HAVE_METADATA) {
                        log('Kicking video.load() as src is present but not ready.');
                        videoPlayer.load();
                    }
                }
                return true;
            },

            pause: function() {
                log('API called: pause()');
                this.currentSettings.playRequestPending = false; // Cancel any pending play request
                videoPlayer.pause();
                return true;
            },

            stop: function() {
                log('API called: stop()');
                this.currentSettings.playRequestPending = false;
                videoPlayer.pause();
                videoPlayer.currentTime = 0;
                return true;
            },
            
            togglePlayPause: function() {
                log('API called: togglePlayPause()');
                if (videoPlayer.paused) {
                    this.play();
                } else {
                    this.pause();
                }
                return true;
            },

            setVolume: function(volume) {
                volume = Math.max(0, Math.min(1, volume));
                log(`API called: setVolume(${Math.round(volume * 100)}%)`);
                this.currentSettings.volume = volume;
                videoPlayer.volume = volume;
                return true;
            },
            
            setLoop: function(shouldLoop) {
                log(`API called: setLoop(${shouldLoop})`);
                this.currentSettings.loop = shouldLoop;
                videoPlayer.loop = shouldLoop;
                return true;
            },

            setFillScreen: function(shouldFill) {
                log(`API called: setFillScreen(${shouldFill})`);
                this.currentSettings.fillScreen = shouldFill;
                applyFitClasses(this.currentSettings.preserveAspectRatio, shouldFill);
                return true;
            },

            setPreserveAspectRatio: function(shouldPreserve) {
                log(`API called: setPreserveAspectRatio(${shouldPreserve})`);
                this.currentSettings.preserveAspectRatio = shouldPreserve;
                applyFitClasses(shouldPreserve, this.currentSettings.fillScreen);
                return true;
            },

            setMuted: function(muted) {
                log(`API called: setMuted(${muted})`);
                relinquishTemporaryMute(activeLoad);
                this.currentSettings.muted = muted;
                videoPlayer.muted = muted;
                return true;
            },
            
            // isPlaying should reflect videoPlayer.paused directly
            isPlaying: function() {
                return videoPlayer && !videoPlayer.paused && videoPlayer.readyState > HTMLMediaElement.HAVE_CURRENT_DATA;
            },

        // For getters, ensure videoPlayer exists and has meaningful data
            getDuration: function() { 
                try {
                    return videoPlayer && !isNaN(videoPlayer.duration) ? videoPlayer.duration : 0; 
                } catch(e) {
                    logError('Error in getDuration: ' + e.message);
                    return 0;
                }
            },
            getCurrentTime: function() { 
                try {
                    return videoPlayer ? videoPlayer.currentTime : 0; 
                } catch(e) {
                    logError('Error in getCurrentTime: ' + e.message);
                    return 0;
                }
            },
            getVideoWidth: function() { 
                try {
                    return videoPlayer ? videoPlayer.videoWidth : 0; 
                } catch(e) {
                    logError('Error in getVideoWidth: ' + e.message);
                    return 0;
                }
            },
            getVideoHeight: function() { 
                try {
                    return videoPlayer ? videoPlayer.videoHeight : 0; 
                } catch(e) {
                    logError('Error in getVideoHeight: ' + e.message);
                    return 0;
                }
            },

            setCurrentTime: function(time) {
                log(`API called: setCurrentTime(${time})`);
                time = Math.max(0, time);
                if (videoPlayer && videoPlayer.readyState > 0) { // HAVE_NOTHING = 0
                    videoPlayer.currentTime = time;
                } else {
                    log("Warning: Video not ready yet for setCurrentTime, command might be ignored.");
                    // Optionally, queue this if critical, but usually seeking requires some metadata.
                }
                return true;
            }
        };

        function normalizeVideoSource(path) {
            return (path === null || path === undefined) ? '' : String(path);
        }

        function beginVideoLoad(source) {
            const previousLoad = activeLoad;
            loadGeneration += 1;
            const load = {
                generation: loadGeneration,
                requestedSource: source,
                expectedMediaSource: '',
                xhr: null,
                xhrExpectedMediaSource: null,
                xhrIsDirectFallback: false,
                fallbackTimer: null,
                unmuteTimer: null,
                temporaryMuteRestoreValue: null,
                ownedObjectUrl: null,
                retired: false
            };

            // Publish the new owner before aborting the old XHR because XMLHttpRequest.abort() fires callbacks synchronously.
            activeLoad = load;
            window.videoPlayerAPI.currentSettings.currentVideoSrc = source;
            window.videoPlayerAPI.currentSettings.videoLoadedAndReady = false;
            const ownedObjectUrl = retireLoad(previousLoad);
            try {
                resetVideoElement();
            } finally {
                revokeOwnedObjectUrl(ownedObjectUrl);
            }
            return load;
        }

        function retireLoad(load) {
            if (!load || load.retired) {
                return null;
            }

            // Null every owned handle before invoking browser APIs; abort and timer callbacks can be reentrant.
            load.retired = true;
            const fallbackTimer = load.fallbackTimer;
            const unmuteTimer = load.unmuteTimer;
            const xhr = load.xhr;
            const temporaryMuteRestoreValue = load.temporaryMuteRestoreValue;
            const ownedObjectUrl = load.ownedObjectUrl;
            load.fallbackTimer = null;
            load.unmuteTimer = null;
            load.xhr = null;
            load.xhrExpectedMediaSource = null;
            load.xhrIsDirectFallback = false;
            load.temporaryMuteRestoreValue = null;
            load.ownedObjectUrl = null;
            load.expectedMediaSource = null;
            load.requestedSource = null;

            // Restore the user's mute intent before any clear/abort call can reentrantly apply a newer explicit choice.
            if (temporaryMuteRestoreValue !== null && window.videoPlayerAPI.currentSettings.muted === temporaryMuteRestoreValue) {
                videoPlayer.muted = temporaryMuteRestoreValue;
            }
            if (fallbackTimer !== null) {
                clearTimeout(fallbackTimer);
            }
            if (unmuteTimer !== null) {
                clearTimeout(unmuteTimer);
            }
            if (xhr !== null) {
                detachXhrCallbacks(xhr);
                try {
                    xhr.abort();
                } catch (e) {
                    logError(`Failed to abort retired video XHR: ${e.message}`);
                }
            }
            return ownedObjectUrl;
        }

        function resetVideoElement() {
            videoPlayer.pause();
            videoPlayer.removeAttribute('src');
            videoPlayer.load();
        }

        function revokeOwnedObjectUrl(objectUrl) {
            if (!objectUrl) {
                return;
            }
            try {
                URL.revokeObjectURL(objectUrl);
            } catch (e) {
                logError(`Failed to revoke owned video object URL: ${e.message}`);
            }
        }

        function detachXhrCallbacks(xhr) {
            xhr.onprogress = null;
            xhr.onload = null;
            xhr.onerror = null;
            xhr.onabort = null;
        }

        function disposeVideoPlayer() {
            if (disposed) {
                return;
            }

            disposed = true;
            loadGeneration += 1;
            const previousLoad = activeLoad;
            activeLoad = null;
            window.videoPlayerAPI.currentSettings.currentVideoSrc = '';
            window.videoPlayerAPI.currentSettings.videoLoadedAndReady = false;
            window.videoPlayerAPI.currentSettings.playRequestPending = false;
            const ownedObjectUrl = retireLoad(previousLoad);
            try {
                resetVideoElement();
            } finally {
                revokeOwnedObjectUrl(ownedObjectUrl);
            }
        }

        function isCurrentLoad(load) {
            return !disposed
                && load !== null
                && !load.retired
                && activeLoad === load
                && load.generation === loadGeneration
                && load.requestedSource === window.videoPlayerAPI.currentSettings.currentVideoSrc;
        }

        function mediaElementMatchesExpectedSource(expectedMediaSource) {
            const assignedSource = videoPlayer.src || '';
            const selectedSource = videoPlayer.currentSrc || '';
            if (!expectedMediaSource) {
                // Chromium can retain the previous read-only currentSrc after removeAttribute('src') + load(). The
                // generation and empty assigned src identify this pre-blob state; media events still require a nonempty
                // exact expected source and therefore cannot claim this context.
                return !assignedSource;
            }
            return assignedSource === expectedMediaSource && (!selectedSource || selectedSource === expectedMediaSource);
        }

        function isExpectedMediaLoad(load, expectedMediaSource) {
            return isCurrentLoad(load)
                && !!expectedMediaSource
                && load.expectedMediaSource === expectedMediaSource
                && mediaElementMatchesExpectedSource(expectedMediaSource);
        }

        function isExpectedXhr(load, xhr, expectedMediaSource) {
            return isCurrentLoad(load)
                && load.xhr === xhr
                && load.xhrExpectedMediaSource === expectedMediaSource
                && load.expectedMediaSource === expectedMediaSource
                && mediaElementMatchesExpectedSource(expectedMediaSource);
        }

        function getExpectedMediaLoad() {
            const load = activeLoad;
            const expectedMediaSource = load ? load.expectedMediaSource : '';
            if (!isExpectedMediaLoad(load, expectedMediaSource)) {
                return null;
            }
            return {load, expectedMediaSource};
        }

        function configureVideoElement() {
            videoPlayer.removeAttribute('controls');
            videoPlayer.setAttribute('nocontrols', '');
            videoPlayer.setAttribute('controlslist', 'nodownload nofullscreen noremoteplayback');
            videoPlayer.controls = false;
        }

        function assignVideoSource(load, source) {
            if (!isCurrentLoad(load)) {
                return false;
            }

            load.expectedMediaSource = '';
            videoPlayer.src = source;
            const expectedMediaSource = videoPlayer.src || '';
            load.expectedMediaSource = expectedMediaSource;
            configureVideoElement();
            videoPlayer.load();
            return isExpectedMediaLoad(load, expectedMediaSource);
        }

        function clearDirectLoadFallback(load, expectedMediaSource) {
            if (!isExpectedMediaLoad(load, expectedMediaSource)) {
                return;
            }

            const fallbackTimer = load.fallbackTimer;
            load.fallbackTimer = null;
            if (fallbackTimer !== null) {
                clearTimeout(fallbackTimer);
            }

            if (load.xhr !== null && load.xhrIsDirectFallback && load.xhrExpectedMediaSource === expectedMediaSource) {
                const xhr = load.xhr;
                load.xhr = null;
                load.xhrExpectedMediaSource = null;
                load.xhrIsDirectFallback = false;
                detachXhrCallbacks(xhr);
                try {
                    xhr.abort();
                } catch (e) {
                    logError(`Failed to abort direct-load fallback XHR: ${e.message}`);
                }
            }
        }

        function releaseXhrOwnership(load, xhr) {
            if (load.xhr !== xhr) {
                return false;
            }
            load.xhr = null;
            load.xhrExpectedMediaSource = null;
            load.xhrIsDirectFallback = false;
            detachXhrCallbacks(xhr);
            return true;
        }

        function directMediaSourceRecovered(load, expectedMediaSource) {
            return isExpectedMediaLoad(load, expectedMediaSource) && videoPlayer.readyState >= HTMLMediaElement.HAVE_CURRENT_DATA;
        }

        function releaseFailedObjectUrlAssignment(load, objectUrl) {
            if (load.ownedObjectUrl !== objectUrl) {
                return;
            }

            // Drop ownership before touching the media element because pause/load can dispatch events synchronously.
            load.ownedObjectUrl = null;
            if (isCurrentLoad(load)) {
                const assignedSource = videoPlayer.src || '';
                const selectedSource = videoPlayer.currentSrc || '';
                if (load.expectedMediaSource === objectUrl || assignedSource === objectUrl || selectedSource === objectUrl) {
                    load.expectedMediaSource = '';
                    try {
                        videoPlayer.pause();
                    } catch (e) {
                        logError(`Failed to pause after video object URL assignment failed: ${e.message}`);
                    }
                    try {
                        videoPlayer.removeAttribute('src');
                    } catch (e) {
                        logError(`Failed to detach video object URL after assignment failed: ${e.message}`);
                    }
                    try {
                        videoPlayer.load();
                    } catch (e) {
                        logError(`Failed to reset video after object URL assignment failed: ${e.message}`);
                    }
                }
            }
            revokeOwnedObjectUrl(objectUrl);
        }

        function relinquishTemporaryMute(load) {
            if (!load) {
                return;
            }
            const unmuteTimer = load.unmuteTimer;
            load.unmuteTimer = null;
            load.temporaryMuteRestoreValue = null;
            if (unmuteTimer !== null) {
                clearTimeout(unmuteTimer);
            }
        }

        function scheduleUnmute(load, expectedMediaSource, restoreValue) {
            const previousTimer = load.unmuteTimer;
            load.unmuteTimer = null;
            if (previousTimer !== null) {
                clearTimeout(previousTimer);
            }

            let timer = null;
            timer = setTimeout(function() {
                if (load.unmuteTimer !== timer) {
                    return;
                }
                load.unmuteTimer = null;
                if (!isExpectedMediaLoad(load, expectedMediaSource) || load.temporaryMuteRestoreValue !== restoreValue) {
                    return;
                }
                log('Attempting to unmute after successful muted autoplay.');
                load.temporaryMuteRestoreValue = null;
                videoPlayer.muted = restoreValue;
            }, 500);
            load.unmuteTimer = timer;
        }

        function tryPlayVideo(load, expectedMediaSource) {
            load = load || activeLoad;
            expectedMediaSource = expectedMediaSource || (load ? load.expectedMediaSource : '');
            log('Attempting to play video (tryPlayVideo)...');
            if (!isExpectedMediaLoad(load, expectedMediaSource)) {
                log('tryPlayVideo: No current expected source. Aborting play attempt.');
                return;
            }

            const playPromise = videoPlayer.play();
            if (playPromise !== undefined && playPromise !== null && typeof playPromise.then === 'function') {
                playPromise.then(() => {
                    if (!isExpectedMediaLoad(load, expectedMediaSource)) {
                        return;
                    }
                    log('Video playback started successfully (tryPlayVideo)');
                    window.videoPlayerAPI.currentSettings.playRequestPending = false;
                }).catch(e => {
                    if (!isExpectedMediaLoad(load, expectedMediaSource) || !window.videoPlayerAPI.currentSettings.playRequestPending) {
                        return;
                    }
                    log(`Standard play failed (tryPlayVideo): ${e.message}. Muted: ${videoPlayer.muted}, ReadyState: ${videoPlayer.readyState}`);
                    if (!videoPlayer.muted) {
                        log('Trying muted playback (tryPlayVideo)...');
                        const originallyMutedByUser = window.videoPlayerAPI.currentSettings.muted;
                        load.temporaryMuteRestoreValue = originallyMutedByUser;
                        videoPlayer.muted = true;

                        const mutedPlayPromise = videoPlayer.play();
                        if (mutedPlayPromise !== undefined && mutedPlayPromise !== null && typeof mutedPlayPromise.then === 'function') {
                            mutedPlayPromise.then(() => {
                                if (!isExpectedMediaLoad(load, expectedMediaSource) || load.temporaryMuteRestoreValue !== originallyMutedByUser) {
                                    return;
                                }
                                log('Muted playback started successfully (tryPlayVideo)');
                                window.videoPlayerAPI.currentSettings.playRequestPending = false;
                                if (!originallyMutedByUser) {
                                    scheduleUnmute(load, expectedMediaSource, originallyMutedByUser);
                                } else {
                                    relinquishTemporaryMute(load);
                                }
                            }).catch(e2 => {
                                if (!isExpectedMediaLoad(load, expectedMediaSource) || load.temporaryMuteRestoreValue !== originallyMutedByUser) {
                                    return;
                                }
                                logError(`Muted play also failed (tryPlayVideo): ${e2.message}`);
                                relinquishTemporaryMute(load);
                                videoPlayer.muted = originallyMutedByUser;
                            });
                        }
                    } else {
                        log('Play failed while already muted (tryPlayVideo). Keeping request pending.');
                    }
                });
            } else {
                log("video.play() did not return a promise. This browser might be older. Relying on events.");
            }
        }

        // Method 1: Direct src attribute (works for some videos)
        function loadVideoDirectly(load) {
            if (!isCurrentLoad(load)) {
                return;
            }
            log(`Loading video directly: ${load.requestedSource}`);
            assignVideoSource(load, load.requestedSource);
        }

        // Method 2: XHR + Blob approach (works for local files and as the direct-load fallback)
        function loadVideoAsBlob(load, isDirectFallback) {
            if (!isCurrentLoad(load) || load.xhr !== null) {
                return;
            }

            const expectedMediaSource = load.expectedMediaSource;
            if (!mediaElementMatchesExpectedSource(expectedMediaSource)) {
                return;
            }
            log(`Loading video as blob: ${load.requestedSource}`);

            const xhr = new XMLHttpRequest();
            try {
                xhr.open('GET', load.requestedSource, true);
                xhr.responseType = 'blob';
            } catch (e) {
                if (isCurrentLoad(load)) {
                    logError(`Failed to initialize video XHR: ${e.message}`);
                    loadVideoDirectly(load);
                }
                return;
            }

            load.xhr = xhr;
            load.xhrExpectedMediaSource = expectedMediaSource;
            load.xhrIsDirectFallback = isDirectFallback;

            xhr.onprogress = function(event) {
                if (!isExpectedXhr(load, xhr, expectedMediaSource)) {
                    return;
                }
                if (event.lengthComputable) {
                    const percentComplete = Math.round((event.loaded / event.total) * 100);
                    log(`Loading progress: ${percentComplete}%`);
                }
            };

            xhr.onload = function() {
                if (!isExpectedXhr(load, xhr, expectedMediaSource)) {
                    return;
                }
                releaseXhrOwnership(load, xhr);

                if (xhr.status !== 200) {
                    logError(`XHR failed with status: ${xhr.status}`);
                    return;
                }

                if (isDirectFallback && directMediaSourceRecovered(load, expectedMediaSource)) {
                    log('Direct loading recovered before the blob fallback completed. Keeping the direct source.');
                    return;
                }

                let objectUrl = null;
                try {
                    objectUrl = URL.createObjectURL(xhr.response);
                } catch (e) {
                    logError(`Failed to create video object URL: ${e.message}`);
                    return;
                }

                // URL creation can be reentrant in an embedded browser. Re-check both ownership and direct readiness
                // before transferring the new object URL to the media element.
                if (!isCurrentLoad(load) || load.expectedMediaSource !== expectedMediaSource || !mediaElementMatchesExpectedSource(expectedMediaSource)) {
                    revokeOwnedObjectUrl(objectUrl);
                    return;
                }
                if (isDirectFallback && directMediaSourceRecovered(load, expectedMediaSource)) {
                    revokeOwnedObjectUrl(objectUrl);
                    log('Direct loading recovered while creating the blob fallback. Keeping the direct source.');
                    return;
                }

                load.ownedObjectUrl = objectUrl;
                log(`Created blob URL: ${objectUrl}`);
                try {
                    if (!assignVideoSource(load, objectUrl)) {
                        releaseFailedObjectUrlAssignment(load, objectUrl);
                    }
                } catch (e) {
                    logError(`Failed to assign video object URL: ${e.message}`);
                    releaseFailedObjectUrlAssignment(load, objectUrl);
                }
            };

            xhr.onerror = function() {
                if (!isExpectedXhr(load, xhr, expectedMediaSource)) {
                    return;
                }
                releaseXhrOwnership(load, xhr);
                logError('XHR network error when loading video');
                log('Trying direct loading as fallback');
                loadVideoDirectly(load);
            };

            xhr.onabort = function() {
                if (!isExpectedXhr(load, xhr, expectedMediaSource)) {
                    return;
                }
                releaseXhrOwnership(load, xhr);
                log('Video XHR was aborted.');
            };

            try {
                xhr.send();
            } catch (e) {
                if (isExpectedXhr(load, xhr, expectedMediaSource)) {
                    releaseXhrOwnership(load, xhr);
                    logError(`Failed to send video XHR: ${e.message}`);
                    loadVideoDirectly(load);
                }
            }
        }

        function scheduleDirectLoadFallback(load, expectedMediaSource) {
            let timer = null;
            timer = setTimeout(function() {
                if (load.fallbackTimer !== timer) {
                    return;
                }
                load.fallbackTimer = null;
                if (!isExpectedMediaLoad(load, expectedMediaSource)) {
                    return;
                }
                if (!videoPlayer.duration && videoPlayer.readyState < HTMLMediaElement.HAVE_CURRENT_DATA) {
                    log('Direct loading not working, trying blob approach');
                    loadVideoAsBlob(load, true);
                }
            }, 2000);
            load.fallbackTimer = timer;
        }

        // Main load function that decides which method to use
        function internalLoadVideo(load) {
            if (!isCurrentLoad(load) || !load.requestedSource) {
                return;
            }
            log(`Loading video from path: ${load.requestedSource}`);

            if (load.requestedSource.startsWith('file://')) {
                loadVideoAsBlob(load, false);
            } else {
                loadVideoDirectly(load);
                if (isCurrentLoad(load)) {
                    scheduleDirectLoadFallback(load, load.expectedMediaSource);
                }
            }
        }

        videoPlayer.addEventListener('loadedmetadata', function() {
            const expectedLoad = getExpectedMediaLoad();
            if (!expectedLoad) {
                return;
            }
            clearDirectLoadFallback(expectedLoad.load, expectedLoad.expectedMediaSource);
            log(`Video metadata loaded: ${videoPlayer.videoWidth}x${videoPlayer.videoHeight}, duration: ${videoPlayer.duration}, readyState: ${videoPlayer.readyState}`);
            applyStoredSettings();
        });

        videoPlayer.addEventListener('canplay', function() {
            const expectedLoad = getExpectedMediaLoad();
            if (!expectedLoad) {
                return;
            }
            clearDirectLoadFallback(expectedLoad.load, expectedLoad.expectedMediaSource);
            log(`Video can play. ReadyState=${videoPlayer.readyState}`);
            if (videoPlayer.readyState >= HTMLMediaElement.HAVE_FUTURE_DATA) {
                window.videoPlayerAPI.currentSettings.videoLoadedAndReady = true;
                log('Set videoLoadedAndReady = true (on canplay)');
            }
            applyStoredSettings();

            if (window.videoPlayerAPI.currentSettings.playRequestPending && window.videoPlayerAPI.currentSettings.videoLoadedAndReady) {
                log('Attempting play due to pending request (on canplay).');
                tryPlayVideo(expectedLoad.load, expectedLoad.expectedMediaSource);
            }
        });

        videoPlayer.addEventListener('canplaythrough', function() {
            const expectedLoad = getExpectedMediaLoad();
            if (!expectedLoad) {
                return;
            }
            clearDirectLoadFallback(expectedLoad.load, expectedLoad.expectedMediaSource);
            log(`Video can play through. ReadyState=${videoPlayer.readyState}`);
            window.videoPlayerAPI.currentSettings.videoLoadedAndReady = true;
            log('Set videoLoadedAndReady = true (on canplaythrough)');

            if (window.videoPlayerAPI.currentSettings.playRequestPending) {
                log('Attempting play due to pending request (on canplaythrough).');
                tryPlayVideo(expectedLoad.load, expectedLoad.expectedMediaSource);
            }
        });

        videoPlayer.addEventListener('playing', function() {
            if (!getExpectedMediaLoad()) {
                return;
            }
            log('Video event: playing. ReadyState=' + videoPlayer.readyState);
            window.videoPlayerAPI.currentSettings.playRequestPending = false;
        });

        videoPlayer.addEventListener('pause', function() {
            if (!getExpectedMediaLoad()) {
                return;
            }
            log('Video event: pause');
        });

        videoPlayer.addEventListener('waiting', function() {
            if (!getExpectedMediaLoad()) {
                return;
            }
            log('Video buffering...');
        });

        videoPlayer.addEventListener('ended', function() {
            if (!getExpectedMediaLoad()) {
                return;
            }
            log('Video ended');
            if (!videoPlayer.loop) {
                window.videoPlayerAPI.currentSettings.playRequestPending = false;
            }
        });

        videoPlayer.addEventListener('error', function() {
            const expectedLoad = getExpectedMediaLoad();
            if (!expectedLoad) {
                return;
            }
            let errorMessage = "Unknown error";

            if (videoPlayer.error) {
                switch(videoPlayer.error.code) {
                    case 1: errorMessage = "Video loading aborted"; break;
                    case 2: errorMessage = "Network error"; break;
                    case 3: errorMessage = "Video decoding failed"; break;
                    case 4: errorMessage = "Video format not supported"; break;
                }
                errorMessage += ` (${videoPlayer.error.code})`;
            }

            logError(`Video error: ${errorMessage}`);
            const videoSrc = videoPlayer.currentSrc || expectedLoad.load.requestedSource || "(unknown)";
            logError(`Source: ${videoSrc}`);
        });

        function applyStoredSettings() {
            log(`Applying settings: Vol=${window.videoPlayerAPI.currentSettings.volume}, Loop=${window.videoPlayerAPI.currentSettings.loop}, Muted=${window.videoPlayerAPI.currentSettings.muted}`);
            videoPlayer.volume = window.videoPlayerAPI.currentSettings.volume;
            videoPlayer.loop = window.videoPlayerAPI.currentSettings.loop;
            videoPlayer.muted = isCurrentLoad(activeLoad) && activeLoad.temporaryMuteRestoreValue !== null ? true : window.videoPlayerAPI.currentSettings.muted;
            applyFitClasses(window.videoPlayerAPI.currentSettings.preserveAspectRatio, window.videoPlayerAPI.currentSettings.fillScreen);
        }

        window.addEventListener('pagehide', disposeVideoPlayer);
        
        // Initial load if path provided in URL
        if (initialVideoPath) {
            log(`Initial video from URL param: ${initialVideoPath}. Wants autoplay: ${wantsAutoplay}`);
            // `wantsAutoplay` already set `playRequestPending` in currentSettings initialization.
            window.videoPlayerAPI.loadVideo(initialVideoPath); // Use API to load
        }
        
        log('FancyMenu Video Player HTML initialized.');
    </script>
</body>
</html>
