# Important Notes:
# Every field you add must be added to the root build.gradle expandProps map.

# Project
version=1.0.0
group=de.keksuccino.fancymenu

# Mod
mod_name=FancyMenu
mod_id=fancymenu
mod_version=3.9.13
mod_description=Customize Minecraft's menus with ease!
mod_license=DSMSLv3.1 (DON'T SNATCH MA STUFF LICENSE v3.1)
mod_authors=Keksuccino

# Rinku
rinku_min_version = 3.0.5

# FER (Fancy Entity Renderer)
# The bundled 26.1.1 API JAR remains compile-only until a 26.3 build is available.
fer_version = 0.5.4

# Watermedia
# No release lists 26.3 support yet; these versions remain compile-only during the port.
watermedia_version = 3.0.0.22
watermedia_binaries_version = 3.0.0.5

# Published mod dependencies
konkrete_version=1.11.1
melody_version=1.0.17

# Mixin Extras
# Keep the shared baseline aligned with NeoForge; Fabric Loader may provide a newer version.
mixin_extras_version = 0.5.4

# Common
minecraft_version=26.3
minecraft_version_upper_bound=26.4
java_version=25

# Fabric
fabric_version=0.161.0+26.3
fabric_short_version=0.161.0
fabric_loader_version=0.19.5
fabric_loom_version=1.18.2

# NeoForge
neoforge_version=26.3.0.6-beta
neoforge_loader_version=12
neogradle_version=7.1.39

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.vfs.watch=true
org.gradle.configureondemand=false
