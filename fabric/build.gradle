
plugins {
    id 'java'
    id 'idea'
    id 'maven-publish'
    id "net.fabricmc.fabric-loom" version "$fabric_loom_version"
}

base {
    archivesName = "${mod_id}"
}

repositories {
    flatDir {
        dirs 'libs'
    }
}

dependencies {

    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    implementation "com.google.code.findbugs:jsr305:3.0.2"
    implementation project(":common")
    include(implementation(annotationProcessor("io.github.llamalad7:mixinextras-fabric:${mixin_extras_version}")))
    include(implementation 'com.github.Keksuccino:japng:0.5.3')
    include(implementation 'com.github.rtyley:animated-gif-lib-for-java:animated-gif-lib-1.7')
    include(implementation 'net.objecthunter:exp4j:0.4.8')
    compileOnly "maven.modrinth:watermedia:${watermedia_version}"
    compileOnly "maven.modrinth:watermedia-binaries:${watermedia_binaries_version}"
    implementation "maven.modrinth:melody:${melody_version}-${minecraft_version}-fabric"
    implementation "maven.modrinth:konkrete:${konkrete_version}-${minecraft_version}-fabric"
    runtimeOnly "maven.modrinth:modmenu:21.0.0-beta.1"
    compileOnly "flatdir:fer:${fer_version}"
    implementation "maven.modrinth:rinku:${rinku_min_version}-${minecraft_version}-fabric"
    
    runtimeOnly "maven.modrinth:sodium:mc26.3-0.9.2-fabric" // Sodium
    runtimeOnly "maven.modrinth:sodium-extra:mc26.3-0.9.4+fabric" // Sodium Extra
    runtimeOnly "maven.modrinth:lithium:mc26.3-0.26.1-fabric" // Lithium
    runtimeOnly "maven.modrinth:iris:1.11.6+26.3-fabric" // Iris
    runtimeOnly "maven.modrinth:immediatelyfast:1.17.1+26.3-fabric" // ImmediatelyFast
    runtimeOnly "maven.modrinth:ferrite-core:9.0.0-fabric" // FerriteCore
    runtimeOnly "maven.modrinth:yacl:3.9.6+26.3-fabric" // YACL

    // The reflection bridge tests exercise the optional API without loading it as a game mod.
    testRuntimeOnly "maven.modrinth:watermedia:${watermedia_version}"
    testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.10.2"

}

loom {
    if (project(":common").file("src/main/resources/${mod_id}.accesswidener").exists()) {
        accessWidenerPath.set(project(":common").file("src/main/resources/${mod_id}.accesswidener"))
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
            sourceSet("main", ":common")
        }
    }
    runs {
        client {
            client()
            setConfigName("Fabric Client")
            ideConfigGenerated(true)
            runDir("../run_client")
        }
        server {
            server()
            setConfigName("Fabric Server")
            ideConfigGenerated(true)
            runDir("../run_server")
        }
    }
}

tasks.named("compileJava", JavaCompile) {
    source(project(":common").sourceSets.main.allSource)
}
tasks.named("compileTestJava", JavaCompile) {
    enabled = true
    source(sourceSets.test.java)
    classpath = sourceSets.test.compileClasspath
}
tasks.withType(Javadoc).configureEach {
    source(project(":common").sourceSets.main.allJava)
}
tasks.withType(Test).configureEach {
    // Allow builds when there are test sources but no matching tests.
    failOnNoDiscoveredTests = false
}
tasks.named("test", Test) {
    enabled = true
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    workingDir(layout.buildDirectory.dir("test-working-directory"))
    doFirst {
        workingDir.mkdirs()
    }
    useJUnitPlatform()
}
tasks.named("sourcesJar", Jar) {
    from(project(":common").sourceSets.main.allSource)
}

processResources {
    from project(":common").sourceSets.main.resources
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = base.archivesName.get()
            from components.java
        }
    }
    repositories {
        maven {
            url = "file://" + System.getenv("local_maven")
        }
    }
}
