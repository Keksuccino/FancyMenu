
plugins {
    id 'idea'
    id 'maven-publish'
    id "net.neoforged.gradle.userdev" version "$neogradle_version"
    id 'java-library'
}

base {
    archivesName = "${mod_id}"
}

// Automatically enable neoforge AccessTransformers if the file exists
// This location is hardcoded in FML and can not be changed.
// https://github.com/neoforged/FancyModLoader/blob/a952595eaaddd571fbc53f43847680b00894e0c1/loader/src/main/java/net/neoforged/fml/loading/moddiscovery/ModFile.java#L118
if (file('src/main/resources/META-INF/accesstransformer.cfg').exists()) {
    minecraft.accessTransformers.file file('src/main/resources/META-INF/accesstransformer.cfg')
}

runs {
    configureEach {
        modSource project.sourceSets.main
    }
    client {
        workingDirectory project.file('../run_client')
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        // Rinku's release wrapper normally sets this before NeoForge creates its early window. NeoGradle 7 cannot place a consumer dependency in that early service layer, so mirror the bootstrap property for development runs.
        systemProperty 'java.awt.headless', 'true'
        dependencies {
            runtime "com.github.Keksuccino:japng:0.5.3"
            runtime "com.github.rtyley:animated-gif-lib-for-java:animated-gif-lib-1.7"
        }
    }
    server {
        workingDirectory project.file('../run_server')
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        arguments.add('--nogui')
    }
}

//Temporarily disabled tests so compiling doesn't fail until I figure out why tf neoforge:test fails
test {
    exclude '**/*'
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

jarJar.enable()

subsystems {
    parchment {
        minecraftVersion = "${parchment_mc_version}"
        mappingsVersion = "${parchment_version}"
    }
}

def rinkuNeoForgeCompileApiConfiguration = configurations.create("rinkuNeoForgeCompileApi")
def rinkuNeoForgeCompileApiFile = layout.buildDirectory.file("rinku-compile-api/rinku-neoforge-api.jar")
def extractRinkuNeoForgeCompileApi = tasks.register("extractRinkuNeoForgeCompileApi") {
    inputs.files(rinkuNeoForgeCompileApiConfiguration)
    outputs.file(rinkuNeoForgeCompileApiFile)
    doLast {
        int copiedFiles = 0
        copy {
            from(zipTree(rinkuNeoForgeCompileApiConfiguration.singleFile)) {
                include "META-INF/jarjar/de.keksuccino.rinku-neoforge-*-mod.jar"
                eachFile { details ->
                    details.path = rinkuNeoForgeCompileApiFile.get().asFile.name
                    copiedFiles++
                }
                includeEmptyDirs = false
            }
            into rinkuNeoForgeCompileApiFile.get().asFile.parentFile
        }
        if (copiedFiles != 1) throw new GradleException("Expected exactly one nested Rinku NeoForge API jar, found ${copiedFiles}")
    }
}
def rinkuNeoForgeCompileApiFiles = files(rinkuNeoForgeCompileApiFile)
rinkuNeoForgeCompileApiFiles.builtBy(extractRinkuNeoForgeCompileApi)

dependencies {
    testImplementation("org.junit.jupiter:junit-jupiter-api:5.10.2")
    testRuntimeOnly("org.junit.jupiter:junit-jupiter-engine:5.10.2")
    implementation "net.neoforged:neoforge:${neoforge_version}"
    implementation "maven.modrinth:konkrete:1.9.9-1.21-neoforge"
    implementation "maven.modrinth:melody:1.0.10-1.21-neoforge"
    //Also needs to get added to the client run configuration (runs -> client -> dependencies) since it's a non-Minecraft library
    implementation(jarJar("com.github.Keksuccino:japng:0.5.3")) {
        jarJar.ranged(it, "[0.5.3,)")
    }
    implementation(jarJar("com.github.rtyley:animated-gif-lib-for-java:animated-gif-lib-1.7")) {
        jarJar.ranged(it, "[1.7,)")
    }
    implementation "it.crystalnest:fancy-entity-renderer-neoforge:$fer_mc_version-$fer_version"
    // Rinku's NeoForge artifact is a bootstrap jar with its API nested as JarJar. NeoGradle 7 does not expose nested classes to javac, so extract that exact loader-native API for compilation.
    rinkuNeoForgeCompileApi "de.keksuccino:rinku-neoforge:3.0.0-1.21.1"
    // The same extracted mod is also the NeoGradle 7 development-runtime source. Consumer dependency metadata continues to expose the outer bootstrap artifact, while the old launcher receives exactly one Rinku module.
    implementation rinkuNeoForgeCompileApiFiles
    implementation "de.keksuccino:rinku-neoforge:3.0.0-1.21.1"
    //implementation "maven.modrinth:watermedia-binaries:${watermedia_binaries_version}"
    //implementation "maven.modrinth:watermedia:${watermedia_version}"
    compileOnly project(":common")
}

compileJava.dependsOn(extractRinkuNeoForgeCompileApi)
tasks.matching { it.name == "runClient" }.configureEach { dependsOn(extractRinkuNeoForgeCompileApi) }
tasks.matching { it.name == "writeMinecraftClasspathClient" }.configureEach { dependsOn(extractRinkuNeoForgeCompileApi) }

// Exclude Fabric Loader from NeoForge
configurations {
    runtimeClasspath {
        exclude group: 'net.fabricmc', module: 'fabric-loader'
        exclude group: 'de.keksuccino', module: 'rinku-neoforge'
    }
    developmentRuntimeClasspath {
        // Gradle 8 names used by ForgeGradle 6
        exclude group: 'net.fabricmc', module: 'fabric-loader'
        exclude group: 'de.keksuccino', module: 'rinku-neoforge'
    }
}

// NeoGradle compiles the game, but we don't want to add our common code to the game's code
Spec<Task> notNeoTask = { Task it -> !it.name.startsWith("neo") } as Spec<Task>

tasks.named("compileJava", JavaCompile) {
    source(project(":common").sourceSets.main.allSource)
}

tasks.withType(Javadoc).matching(notNeoTask).configureEach {
    source(project(":common").sourceSets.main.allJava)
}

tasks.named("sourcesJar", Jar) {
    from(project(":common").sourceSets.main.allSource)
}

tasks.withType(ProcessResources).matching(notNeoTask).configureEach {
    from project(":common").sourceSets.main.resources
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId base.archivesName.get()
            from components.java
        }
    }
    repositories {
        maven {
            url "file://" + System.getenv("local_maven")
        }
    }
}
